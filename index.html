function fxAplicarView() {
  const v = ED.fxView; const m = $("#fx-mundo"); if (!m || !v) return;
  m.style.transform = "translate(" + v.x + "px," + v.y + "px) scale(" + v.z + ")";
  $("#fx-zv").textContent = Math.round(v.z * 100) + "%";
  const ctl = $(".fx-aresta-ctl"); if (ctl) ctl.style.transform = "translate(-50%,-50%) scale(" + (1 / v.z) + ")";
  $("#fluxo").style.backgroundPosition = v.x + "px " + v.y + "px";
  $("#fluxo").style.backgroundSize = (20 * v.z) + "px " + (20 * v.z) + "px";
}
function fxAjustar() {
  const cv = $("#fluxo"); const els = $$(".fx-no", cv); if (!els.length) { ED.fxView = { x: 40, y: 40, z: 1 }; return; }
  const pos = fxPosicoes();
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  els.forEach((el) => { const p = pos[el.dataset.no]; if (!p) return; x1 = Math.min(x1, p[0]); y1 = Math.min(y1, p[1]); x2 = Math.max(x2, p[0] + el.offsetWidth); y2 = Math.max(y2, p[1] + el.offsetHeight); });
  const W = cv.clientWidth, H = cv.clientHeight, pad = 60;
  if (W < 700) { // celular: começa pela primeira etapa num tamanho que dá para ler
    const z = .72, pIni = pos[els[0].dataset.no];
    ED.fxView = { z, x: 24 - pIni[0] * z, y: 70 - pIni[1] * z }; return;
  }
  const z = Math.max(.3, Math.min(1, (W - pad * 2) / (x2 - x1), (H - pad * 2 - 30) / (y2 - y1)));
  ED.fxView = { z, x: (W - (x2 - x1) * z) / 2 - x1 * z, y: Math.max(pad, (H - (y2 - y1) * z) / 2) - y1 * z };
}

function desenharFluxo() {
  const caixa = $("#fx-nos"); if (!caixa) return;
  if (ED.fxArrastando) { ED.fxPendente = true; return; } // não troca os cartões no meio de um arrasto
  const f = ED.form, nos = fxNos(), pos = fxPosicoes();
  if (nos.some((n) => !pos[n.id])) fxAutoLayout(true);
  // entradas para achar etapas soltas
  const entra = new Set();
  if (f.perguntas[0]) entra.add(f.perguntas[0].id);
  f.perguntas.forEach((p) => fxPortas(p).forEach((pt) => { if (pt.alvo) entra.add(pt.alvo); }));
  let n = 0;
  caixa.innerHTML = nos.map((no) => {
    const [x, y] = pos[no.id];
    const on = ED.sel === no.id ? " on" : "";
    if (no.tipo === "inicio") {
      const i = f.inicio;
      return '<div class="fx-no fx-inicio' + on + '" data-no="inicio" style="left:' + x + "px;top:" + y + 'px"><div class="fx-cab"><small><span class="fx-ic t-tela">▶</span>Boas-vindas</small><b>' + h(i.titulo || "Tela de boas-vindas") + "</b></div>" +
        '<div class="fx-portas"><div class="fx-porta padrao" data-chave="inicio"><span class="rot">' + h(i.botao || "Começar") + '</span><span class="fx-dot ligado fixa" title="Sempre vai para a primeira pergunta"></span></div></div></div>';
    }
    if (no.tipo === "fim") {
      const fi = no.fi;
      return '<div class="fx-no fx-fim' + on + '" data-no="' + no.id + '" style="left:' + x + "px;top:" + y + 'px"><span class="fx-in"></span><div class="fx-cab"><small><span class="fx-ic t-fim">✓</span>Tela final' + (no.padrao ? " · padrão" : "") + "</small><b>" + h(fi.nome || fi.titulo || "Final") + "</b>" +
        (fi.redirecionar ? '<span class="fx-info">↗ redireciona</span>' : "") + (!no.padrao && !entra.has(no.id) ? '<span class="fx-solta">sem ligação</span>' : "") + "</div></div>";
    }
    const p = no.p, t = T[p.tipo] || T.curto;
    if (FM.ehPergunta(p)) n++;
    const portas = fxPortas(p);
    return '<div class="fx-no' + on + (p.tipo === "active" ? " fx-integ" : FM.ehInterno(p) ? " fx-logica" : "") + '" data-no="' + p.id + '" style="left:' + x + "px;top:" + y + 'px"><span class="fx-in"></span>' +
      '<div class="fx-cab"><small><span class="fx-ic ' + GRUPO_CLS[t.grupo] + '">' + t.ic + "</span>" + (FM.ehPergunta(p) ? n + " · " : "") + t.nome + "</small>" +
      '<b data-tit="' + p.id + '">' + h(p.titulo || "Sem título") + "</b>" + (FM.ehInterno(p) ? '<span class="fx-resumo">' + h(resumoBloco(p)) + "</span>" : "") + (!entra.has(p.id) ? '<span class="fx-solta" title="Nenhuma etapa leva até aqui">sem entrada</span>' : "") + "</div>" +
      '<div class="fx-portas">' + portas.map((pt) => '<div class="fx-porta ' + pt.cls + '" data-chave="' + h(pt.chave) + '" title="' + h(pt.rot) + (pt.alvo ? "" : pt.spec.tipo === "padrao" ? " — sem ligação: vai para a tela final padrão" : " — sem ligação: segue “Qualquer outra resposta”") + '"><span class="rot">' + h(pt.rot) + "</span>" +
        '<span class="fx-dot' + (pt.alvo ? (pt.impl ? " impl" : " ligado") : "") + '" data-q="' + p.id + '" data-chave="' + h(pt.chave) + '"></span></div>').join("") + "</div></div>";
  }).join("");
  medirFluxo();
  desenharArestas();
}
// mede uma vez os cartões e as bolinhas (largura e altura de cada saída) e guarda as saídas de cada pergunta
function medirFluxo() {
  const geo = {}, portasC = {};
  $$("#fx-nos .fx-no").forEach((el) => {
    const g = { w: el.offsetWidth, h: el.offsetHeight, portas: {} };
    $$(".fx-porta[data-chave]", el).forEach((pt) => { g.portas[pt.dataset.chave] = pt.offsetTop + pt.offsetHeight / 2; });
    geo[el.dataset.no] = g;
  });
  ED.form.perguntas.forEach((p) => { portasC[p.id] = fxPortas(p); });
  ED.fxGeo = geo; ED.fxPortasC = portasC;
}
function fxSaida(id, chave) { const g = (ED.fxGeo || {})[id], p = fxPosicoes()[id]; return g && p && g.portas[chave] != null ? [p[0] + g.w, p[1] + g.portas[chave]] : null; }
function fxEntrada(id) { const g = (ED.fxGeo || {})[id], p = fxPosicoes()[id]; return g && p ? [p[0], p[1] + 26] : null; }

function fxPonto(el, porta) {
  const pos = fxPosicoes()[el.dataset.no];
  if (porta) return [pos[0] + el.offsetWidth, pos[1] + porta.offsetTop + porta.offsetHeight / 2];
  return [pos[0], pos[1] + 26];
}
function fxCurva(a, b) {
  const dx = b[0] >= a[0] ? Math.max(50, (b[0] - a[0]) / 2) : 140;
  const c1 = [a[0] + dx, a[1]], c2 = [b[0] - dx, b[1]];
  return { d: "M" + a[0] + "," + a[1] + " C" + c1[0] + "," + c1[1] + " " + c2[0] + "," + c2[1] + " " + b[0] + "," + b[1],
    meio: [.125 * a[0] + .375 * c1[0] + .375 * c2[0] + .125 * b[0], .125 * a[1] + .375 * c1[1] + .375 * c2[1] + .125 * b[1]] };
}
function desenharArestas() {
  const g = $("#fx-g"); if (!g) return;
  const f = ED.form; let svg = "", botao = "";
  if (!ED.fxGeo) medirFluxo();
  if (ED.fxGeo.inicio && f.perguntas[0]) {
    const a = fxSaida("inicio", "inicio"), b = fxEntrada(f.perguntas[0].id);
    if (a && b) svg += '<path class="fx-linha padrao" d="' + fxCurva(a, b).d + '"/>';
  }
  f.perguntas.forEach((p) => {
    (ED.fxPortasC[p.id] || []).forEach((pt) => {
      if (!pt.alvo) return;
      const a = fxSaida(p.id, pt.chave), b = fxEntrada(pt.alvo);
      if (!a || !b) return;
      const c = fxCurva(a, b);
      const sel = ED.fxAresta && ED.fxAresta.q === p.id && ED.fxAresta.chave === pt.chave;
      const cls = "fx-linha " + pt.cls + (pt.impl ? " impl" : "") + (sel ? " sel" : "");
      svg += '<path class="fx-hit" data-q="' + p.id + '" data-chave="' + h(pt.chave) + '" d="' + c.d + '"><title>' + h(pt.rot) + " → " + h(fxNome(pt.alvo)) + '</title></path><path class="' + cls + '" d="' + c.d + '"/>';
      if (sel) botao = '<div class="fx-aresta-ctl" style="left:' + c.meio[0] + "px;top:" + c.meio[1] + "px;transform:translate(-50%,-50%) scale(" + (1 / ED.fxView.z) + ')">' +
        '<button class="mini perigo" id="fx-rm">Remover ligação</button>' + (pt.impl ? '<small class="fx-obs">automática: segue a ordem da lista</small>' : "") + "</div>";
    });
  });
  g.innerHTML = svg;
  const antigo = $(".fx-aresta-ctl"); if (antigo) antigo.remove();
  if (botao) {
    $("#fx-mundo").insertAdjacentHTML("beforeend", botao);
    const rm = $("#fx-rm");
    if (rm) rm.onclick = (e) => { e.stopPropagation(); fxRemoverSel(); };
  }
}
function fxRemoverSel() {
  const a = ED.fxAresta; if (!a) return;
  const p = P(a.q); ED.fxAresta = null;
  if (p) fxDesligar(p, a.chave);
  desenharFluxo();
  toast(a.chave === "padrao" ? "Ligação removida. Sem ligação, quem chegar aqui vai para a tela final padrão." : "Ligação removida. Essa resposta agora segue “Qualquer outra resposta”.");
}
// bloco novo entra solto: não herda a "próxima da lista" de ninguém
function fxNovoBloco(tipo) {
  const f = ED.form;
  const ult = f.perguntas[f.perguntas.length - 1];
  if (ult && !ult.depois) ult.depois = f.finais[0] ? "fim:" + f.finais[0].id : "fim"; // mantém para onde a última já ia
  const nova = { id: FM.uid("q"), tipo, titulo: "", descricao: "", obrigatorio: false, chave: "", regras: [], depois: "fim" };
  prepararTipo(nova);
  f.perguntas.push(nova);
  return nova;
}
// procura um lugar livre perto de (x, y), descendo até não encostar em nenhum cartão
function fxLugarLivre(x, y, ignorar) {
  const pos = fxPosicoes();
  const caixas = $$(".fx-no").filter((el) => el.dataset.no !== ignorar && pos[el.dataset.no]).map((el) => { const p = pos[el.dataset.no]; return [p[0] - 30, p[1] - 30, p[0] + el.offsetWidth + 30, p[1] + el.offsetHeight + 30]; });
  const bate = (px, py) => caixas.some((c) => px < c[2] && px + FX_W > c[0] && py < c[3] && py + 160 > c[1]);
  for (let i = 0; i < 80; i++) { const py = y + i * 40; if (!bate(x, py)) return [Math.round(x), Math.round(py)]; }
  return [Math.round(x), Math.round(y)];
}
function fxNome(id) {
  if (!id) return "";
  if (id.startsWith("fim:")) { const fi = Fim(id.slice(4)); return fi ? "✓ " + (fi.nome || fi.titulo) : ""; }
  const q = P(id); return q ? rotuloQ(q) : "";
}

function fxSelecionar(id) {
  ED.sel = id; ED.fxAresta = null;
  $$(".fx-no").forEach((el) => el.classList.toggle("on", el.dataset.no === id));
  desenharArestas(); fxPainel();
}

function ligarFluxo() {
  const cv = $("#fluxo");
  const mundoPt = (e) => { const r = cv.getBoundingClientRect(), v = ED.fxView; return [(e.clientX - r.left - v.x) / v.z, (e.clientY - r.top - v.y) / v.z]; };
  let acao = null;

  const toques = new Map(); let pinca = null;
  const distTq = () => { const [a, b] = [...toques.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  cv.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch") toques.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (toques.size === 2) {
    const t = $("#fx-temp"); if (t) t.remove(); acao = null;
    const [a, b] = [...toques.values()], r = cv.getBoundingClientRect();
    pinca = { d0: distTq(), z0: ED.fxView.z, x0: ED.fxView.x, y0: ED.fxView.y, cx: (a.x + b.x) / 2 - r.left, cy: (a.y + b.y) / 2 - r.top };
  } }, true);
  cv.addEventListener("pointermove", (e) => {
    if (!toques.has(e.pointerId)) return;
    toques.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinca && toques.size === 2) {
      const v = ED.fxView, z = Math.max(.25, Math.min(1.8, pinca.z0 * distTq() / pinca.d0));
      const [a, b] = [...toques.values()], r = cv.getBoundingClientRect();
      const cx = (a.x + b.x) / 2 - r.left, cy = (a.y + b.y) / 2 - r.top;
      v.z = z; v.x = cx - (pinca.cx - pinca.x0) * z / pinca.z0; v.y = cy - (pinca.cy - pinca.y0) * z / pinca.z0;
      fxAplicarView(); e.stopImmediatePropagation();
    }
  }, true);
  const fimToque = (e) => { toques.delete(e.pointerId); if (toques.size < 2) pinca = null; };
  cv.addEventListener("pointerup", fimToque, true);
  cv.addEventListener("pointercancel", fimToque, true);
  let quadro = 0, ultimoMov = null;
  const comecar = (e, a) => {
    acao = a; ED.fxArrastando = true;
    try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  };
  const limpar = () => {
    acao = null; ED.fxArrastando = false;
    if (quadro) { cancelAnimationFrame(quadro); quadro = 0; }
    cv.classList.remove("arrastando");
    const t = $("#fx-temp"); if (t) t.remove();
    $$(".fx-no.alvo").forEach((x) => x.classList.remove("alvo"));
    if (ED.fxPendente) { ED.fxPendente = false; desenharFluxo(); }
  };
  cv.addEventListener("pointerdown", (e) => {
    if (pinca) return;
    if (acao) limpar(); // arrasto anterior que não terminou direito
    if (e.button !== 0 || e.target.closest(".fx-barra,.fx-zoom,.fx-aresta-ctl")) return;
    const dot = e.target.closest(".fx-dot");
    const hit = e.target.closest(".fx-hit");
    const no = e.target.closest(".fx-no");
    if (dot && !dot.classList.contains("fixa")) {
      const de = fxSaida(dot.dataset.q, dot.dataset.chave) || mundoPt(e);
      comecar(e, { tipo: "ligar", q: dot.dataset.q, chave: dot.dataset.chave, de, ini: [e.clientX, e.clientY], moveu: false });
      $("#fx-g").insertAdjacentHTML("beforeend", '<path id="fx-temp" class="fx-linha temp" d=""/>');
      e.preventDefault(); return;
    }
    if (hit) { ED.fxAresta = { q: hit.dataset.q, chave: hit.dataset.chave }; desenharArestas(); e.preventDefault(); return; }
    if (no) {
      const p0 = fxPosicoes()[no.dataset.no];
      comecar(e, { tipo: "mover", id: no.dataset.no, ini: [e.clientX, e.clientY], p0: p0.slice(), moveu: false });
      e.preventDefault(); return;
    }
    comecar(e, { tipo: "pan", ini: [e.clientX, e.clientY], v0: Object.assign({}, ED.fxView), moveu: false });
    cv.classList.add("arrastando"); e.preventDefault();
  });
  const aplicarMov = () => {
    quadro = 0;
    const e = ultimoMov; if (!acao || !e) return;
    if (acao.tipo === "pan") {
      ED.fxView.x = acao.v0.x + (e.clientX - acao.ini[0]); ED.fxView.y = acao.v0.y + (e.clientY - acao.ini[1]); fxAplicarView();
    } else if (acao.tipo === "mover") {
      const z = ED.fxView.z, dx = (e.clientX - acao.ini[0]) / z, dy = (e.clientY - acao.ini[1]) / z;
      const p = fxPosicoes()[acao.id]; if (!p) return;
      p[0] = Math.round(acao.p0[0] + dx); p[1] = Math.round(acao.p0[1] + dy);
      const el = $('.fx-no[data-no="' + CSS.escape(acao.id) + '"]');
      if (el) { el.style.left = p[0] + "px"; el.style.top = p[1] + "px"; }
      desenharArestas();
    } else if (acao.tipo === "ligar") {
      const t = $("#fx-temp"); if (t) t.setAttribute("d", fxCurva(acao.de, mundoPt(e)).d);
      const sob = document.elementFromPoint(e.clientX, e.clientY);
      const alvo = sob && sob.closest(".fx-no");
      $$(".fx-no.alvo").forEach((x) => x !== alvo && x.classList.remove("alvo"));
      if (alvo && alvo.dataset.no !== acao.q && alvo.dataset.no !== "inicio") alvo.classList.add("alvo");
    }
  };
  cv.addEventListener("pointermove", (e) => {
    if (!acao) return;
    if (e.pointerType === "mouse" && e.buttons === 0) { fim(e); return; } // soltou fora da janela
    const d = Math.abs(e.clientX - acao.ini[0]) + Math.abs(e.clientY - acao.ini[1]);
    if (d > (acao.tipo === "ligar" ? 6 : 3)) acao.moveu = true;
    if (!acao.moveu) return;
    ultimoMov = e;
    if (!quadro) quadro = requestAnimationFrame(aplicarMov);
  });
  const fim = (e) => {
    if (!acao) return;
    if (acao.moveu && ultimoMov) aplicarMov();
    const a = acao; limpar();
    if (a.tipo === "pan" && !a.moveu) { ED.sel = null; ED.fxAresta = null; $$(".fx-no.on").forEach((x) => x.classList.remove("on")); desenharArestas(); fxPainel(); }
    if (a.tipo === "mover") { if (a.moveu) marcarSujo(true); else fxSelecionar(a.id); }
    if (a.tipo === "ligar") {
      if (!a.moveu) return; // só um clique na bolinha: não liga nem abre nada
      const sob = document.elementFromPoint(e.clientX, e.clientY);
      const alvo = sob && sob.closest(".fx-no");
      const p = P(a.q); if (!p) return;
      if (alvo && alvo.dataset.no !== "inicio" && alvo.dataset.no !== a.q) { fxLigar(p, a.chave, alvo.dataset.no); desenharFluxo(); toast("Ligado a " + fxNome(alvo.dataset.no)); }
      else if (!alvo && sob && sob.closest("#fluxo")) {
        const pt = mundoPt(e);
        escolherTipo((tipo) => {
          const nova = fxNovoBloco(tipo);
          fxPosicoes()[nova.id] = [Math.round(pt[0]), Math.round(pt[1] - 26)];
          fxLigar(p, a.chave, nova.id);
          desenharFluxo(); fxSelecionar(nova.id);
          setTimeout(() => { const ti = $("#q-titulo"); if (ti) ti.focus(); }, 60);
        });
      }
    }
  };
  cv.addEventListener("pointerup", fim);
  cv.addEventListener("pointercancel", () => { const a = acao; limpar(); if (a && a.tipo === "mover" && a.moveu) marcarSujo(true); });
  cv.addEventListener("lostpointercapture", (e) => { if (acao) fim(e); });
  window.addEventListener("blur", () => { if (acao && $("#fluxo")) { const a = acao; limpar(); if (a.tipo === "mover" && a.moveu) marcarSujo(true); } });
  cv.addEventListener("wheel", (e) => {
    e.preventDefault();
    const v = ED.fxView;
    if (e.ctrlKey || e.metaKey) {
      const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
      const z = Math.max(.25, Math.min(1.8, v.z * Math.exp(-e.deltaY * .002)));
      v.x = mx - (mx - v.x) * z / v.z; v.y = my - (my - v.y) * z / v.z; v.z = z;
    } else { v.x -= e.deltaX; v.y -= e.deltaY; }
    fxAplicarView();
  }, { passive: false });
  cv.addEventListener("keydown", (e) => {
    if ((e.key === "Delete" || e.key === "Backspace") && ED.fxAresta && !e.target.closest("input,textarea,select")) {
      fxRemoverSel();
    }
  });
  const zoom = (fator) => {
    const v = ED.fxView, W = cv.clientWidth / 2, H = cv.clientHeight / 2;
    const z = Math.max(.25, Math.min(1.8, v.z * fator));
    v.x = W - (W - v.x) * z / v.z; v.y = H - (H - v.y) * z / v.z; v.z = z; fxAplicarView();
  };
  $("#fx-zm").onclick = () => zoom(1 / 1.2);
  $("#fx-zp").onclick = () => zoom(1.2);
  $("#fx-fit").onclick = () => { fxAjustar(); fxAplicarView(); };
  $("#fx-org").onclick = () => { fxAutoLayout(false); marcarSujo(true); desenharFluxo(); fxAjustar(); fxAplicarView(); };
  $("#fx-addq").onclick = () => escolherTipo((tipo) => {
    const ref = P(ED.sel);
    const nova = fxNovoBloco(tipo);
    const pr = ref && fxPosicoes()[ref.id];
    const v = ED.fxView, cvr = cv.getBoundingClientRect();
    fxPosicoes()[nova.id] = pr ? fxLugarLivre(pr[0] + FX_W + 110, pr[1], nova.id) : fxLugarLivre((cvr.width / 2 - v.x) / v.z - FX_W / 2, (cvr.height / 3 - v.y) / v.z, nova.id);
    marcarSujo(); desenharFluxo(); fxSelecionar(nova.id);
    setTimeout(() => { const ti = $("#q-titulo"); if (ti) ti.focus(); }, 60);
  });
  $("#fx-addf").onclick = () => {
    const fi = novoFinal("Obrigado!"); fi.nome = "Final " + (ED.form.finais.length + 1);
    ED.form.finais.push(fi); marcarSujo(); desenharFluxo(); fxSelecionar("fim:" + fi.id);
  };
  $("#fx-fechar").onclick = () => { ED.sel = null; $$(".fx-no.on").forEach((x) => x.classList.remove("on")); fxPainel(); };
}

    });

    $("#cap-salvar").onclick = async () => {

      if (new Set(chaves).size !== chaves.length) return toast("Tem parâmetro repetido na lista.", true);
      const valor = { lista: c.lista.filter((x) => x.chave), lembrar: c.lembrar, dias: c.dias, outros: c.outros };
      $("#cap-salvar").disabled = true;
      const { error } = await sb.from("fm_ajustes").upsert({ chave: "parametros", valor, atualizado_em: new Date().toISOString() });
      $("#cap-salvar").disabled = false;
      if (error) return toast("Não salvou: " + error.message, true);
      CAP = FM.capturaConfig(valor); sujo = false; toast("Parâmetros salvos"); desenhar(); $("#cap-st").textContent = "Salvo ✓";
    };
  };
  desenhar();
}

// ---------------- ACTIVECAMPAIGN ----------------
async function funcActive(corpo) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error("Faça login de novo.");
  const r = await fetch(CFG.url + "/functions/v1/fm-active", {
    method: "POST", headers: { Authorization: "Bearer " + session.access_token, apikey: CFG.anon, "Content-Type": "application/json" },
    body: JSON.stringify(corpo)
  });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok || !d.ok) throw new Error(d.erro || "Não foi possível falar com o ActiveCampaign (" + r.status + ").");
  return d;
}
const AC = { status: null, campos: null, listas: null, carregando: {} };
function acCarregar(qual, forcar) {
  if (!forcar && AC[qual]) return Promise.resolve(AC[qual]);
  if (AC.carregando[qual]) return AC.carregando[qual];
  const pr = funcActive({ acao: qual }).then((d) => { AC[qual] = qual === "listas" ? d.listas : qual === "campos" ? { padrao: d.padrao, campos: d.campos } : d; return AC[qual]; })
    .finally(() => { delete AC.carregando[qual]; });
  AC.carregando[qual] = pr;
  return pr;
}

function resumoActive(p) {
  const ac = p.ac || {};
  const partes = ["e-mail"];
  const n = (ac.campos || []).filter((m) => m.ac && m.fonte).length;
  if (n) partes.push(n + " campo" + (n > 1 ? "s" : ""));
  if ((ac.tags || []).length) partes.push(ac.tags.length + " tag" + (ac.tags.length > 1 ? "s" : ""));
  if (ac.lista) partes.push("lista");
  return partes.join(" · ");
}

// editor de condições reaproveitável (usado nas regras de pontuação)
function htmlConds(r, candidatas) {
  r.conds = r.conds || []; if (!r.conds.length && candidatas[0]) { const q0 = candidatas[0], v0 = valoresPossiveis(q0); r.conds.push({ pergunta: q0.id, op: opsPara(q0)[0][0], valor: v0 ? v0[0] : "" }); }
  return r.conds.map((c, ci) => {
    const q = Pq(c.pergunta);
    const ops = opsPara(q);
    if (q && ops.length && !ops.some(([k]) => k === c.op)) c.op = ops[0][0];
    const semValor = ["respondeu", "nao_respondeu"].includes(c.op);
    const vals = valoresPossiveis(q);
    let campoV = "<span></span>";
    if (!semValor) {
      if (vals) { if (!vals.includes(String(c.valor))) c.valor = vals[0] || ""; campoV = '<select data-cv="' + ci + '">' + vals.map((v) => "<option" + (String(c.valor) === v ? " selected" : "") + ">" + h(v) + "</option>").join("") + "</select>"; }
      else campoV = '<input data-cv="' + ci + '" value="' + h(c.valor == null ? "" : c.valor) + '" placeholder="valor"' + (q && q.tipo === "numero" ? ' inputmode="decimal"' : "") + ">";
    }
    return '<div class="cond"><span class="pre">' + (ci === 0 ? "Se" : (r.juncao === "ou" ? "ou" : "e")) + "</span>" +
      '<select data-cq="' + ci + '">' + candidatas.map((q2) => '<option value="' + h(q2.id) + '"' + (c.pergunta === q2.id ? " selected" : "") + ">" + h(rotuloQ(q2)) + "</option>").join("") + "</select>" +
      '<select data-co="' + ci + '">' + ops.map(([k, l]) => '<option value="' + k + '"' + (c.op === k ? " selected" : "") + ">" + l + "</option>").join("") + "</select>" + campoV +
      (r.conds.length > 1 ? '<button class="ico ghost mini" data-cdel="' + ci + '" aria-label="Remover condição">×</button>' : "<span></span>") + "</div>";
  }).join("");
}
function ligarConds(el, r, refazer, mudou) {
  $$("[data-cq]", el).forEach((sl) => sl.onchange = () => { const c = r.conds[+sl.dataset.cq]; c.pergunta = sl.value; const q = Pq(sl.value); c.op = opsPara(q)[0][0]; const v = valoresPossiveis(q); c.valor = v ? v[0] : ""; mudou(); refazer(); });
  $$("[data-co]", el).forEach((sl) => sl.onchange = () => { r.conds[+sl.dataset.co].op = sl.value; mudou(); refazer(); });
  $$("[data-cv]", el).forEach((sl) => sl.addEventListener(sl.tagName === "SELECT" ? "change" : "input", () => { r.conds[+sl.dataset.cv].valor = sl.value; mudou(); }));
  $$("[data-cdel]", el).forEach((b) => b.onclick = () => { r.conds.splice(+b.dataset.cdel, 1); mudou(); refazer(); });
}

function painelScore(pn, p) {

  const numericas = f.perguntas.filter((q) => ["nps", "escala", "estrelas", "numero", "multipla"].includes(q.tipo));

  pn.innerHTML = '<div class="painel-in">' + cabBloco(p, i, f, "Lead Score") +
    '<div class="card"><p class="ajuda" style="margin:0 0 12px">Quem responde não vê esta etapa. Ao passar por aqui, o formulário soma os pontos das regras que baterem e guarda o resultado na variável. Use depois um bloco <b>Condição por score</b> para separar os caminhos, ou mande o score para o ActiveCampaign.</p>' +
    '<div class="g2">' + campo("Nome do bloco", '<input id="sc-nome" value="' + h(p.titulo || "") + '" maxlength="80">') +
    campo("Variável", '<input id="sc-var" value="' + h(FM.nomeVar(p)) + '" maxlength="30">', "Use como <code>{{" + h(FM.nomeVar(p)) + "}}</code> em textos.") + "</div>" +
    '<label class="tg"><input type="checkbox" id="sc-zerar"' + (p.zerar !== false ? " checked" : "") + "> Começar do zero (desligado: soma ao valor que a variável já tinha)</label></div>" +

    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="mini" id="sc-add">+ Regra (se… então pontos)</button><button class="mini" id="sc-op">+ Pontuar as opções de uma pergunta</button><button class="mini" id="sc-val">+ Somar o valor de uma resposta</button></div>' +
    '<div class="score-total"><span>Pontuação máxima pelas regras: <b>' + String(maxPos).replace(".", ",") + "</b></span><span>Regras: <b>" + p.pontuacao.length + "</b></span></div></div>" +
    '<div class="card" id="logica"></div></div>';
  const mud = (leve) => { marcarSujo(); renderLadoLeve(); if (!leve) redesenhar(); };
  const redesenhar = () => {
    const box = $("#sc-regras"); if (!box) return;
    box.innerHTML = p.pontuacao.length ? p.pontuacao.map((r, ri) => {
      if (r.tipo === "valor") {
        return '<div class="regra" data-ri="' + ri + '"><div class="regra-cab"><span>Regra ' + (ri + 1) + " · valor da resposta</span>" + '<button class="ico ghost mini" data-rdel aria-label="Remover regra">×</button></div>' +
          '<div class="cond" style="grid-template-columns:auto 1fr auto 100px"><span class="pre">Somar</span><select data-vq>' + numericas.map((q) => '<option value="' + q.id + '"' + (r.pergunta === q.id ? " selected" : "") + ">" + h(rotuloQ(q)) + (q.tipo === "multipla" ? " (nº de opções marcadas)" : "") + "</option>").join("") + '</select><span class="pre" style="width:auto">×</span><input data-vf value="' + h(r.fator == null ? 1 : r.fator) + '" inputmode="decimal"></div></div>';
      }
      return '<div class="regra" data-ri="' + ri + '"><div class="regra-cab"><span>Regra ' + (ri + 1) + "</span>" +
        '<span style="display:flex;gap:6px;align-items:center">' + ((r.conds || []).length > 1 ? '<span class="juncao"><button data-jn="e" class="' + (r.juncao !== "ou" ? "on" : "") + '">E</button><button data-jn="ou" class="' + (r.juncao === "ou" ? "on" : "") + '">OU</button></span>' : "") +
        '<button class="ico ghost mini" data-rdel aria-label="Remover regra">×</button></span></div>' +
        htmlConds(r, candidatas) + '<button class="mini ghost" data-cadd>+ condição</button>' +
        '<div class="pts"><b>→ somar</b><input data-pts value="' + h(r.pontos == null ? "" : r.pontos) + '" inputmode="decimal" placeholder="10"><span class="mut" style="font-size:12.5px">pontos (use negativo para tirar)</span></div></div>';
    }).join("") : '<p class="mut" style="margin-bottom:12px">Nenhuma regra ainda. Ex.: “Se a nota for maior que 9 → +30 pontos”, “Se faturamento é Mais de R$ 20 mil → +40”.</p>';
    $$(".regra", box).forEach((el) => {
      const r = p.pontuacao[+el.dataset.ri];
      $("[data-rdel]", el).onclick = () => { p.pontuacao.splice(+el.dataset.ri, 1); mud(); painelScore(pn, p); };
      if (r.tipo === "valor") {
        $("[data-vq]", el).onchange = (e) => { r.pergunta = e.target.value; mud(true); };
        $("[data-vf]", el).oninput = (e) => { r.fator = e.target.value.replace(",", "."); mud(true); };
        return;
      }
      ligarConds(el, r, redesenhar, () => mud(true));
      $$("[data-jn]", el).forEach((b) => b.onclick = () => { r.juncao = b.dataset.jn; mud(); });
      $("[data-cadd]", el).onclick = () => { const q = Pq(r.conds[r.conds.length - 1].pergunta) || candidatas[0]; const v = valoresPossiveis(q); r.conds.push({ pergunta: q.id, op: opsPara(q)[0][0], valor: v ? v[0] : "" }); mud(); };
      $("[data-pts]", el).oninput = (e) => { r.pontos = e.target.value.replace(",", "."); marcarSujo(true); const mx = $(".score-total b"); if (mx) mx.textContent = String(p.pontuacao.reduce((a, x) => a + (x.tipo === "valor" ? 0 : Math.max(0, FM.num(x.pontos) || 0)), 0)).replace(".", ","); };
    });
  };
  redesenhar();
  $("#sc-nome").oninput = (e) => { p.titulo = e.target.value; mud(true); };
  $("#sc-var").oninput = (e) => { const v = e.target.value.replace(/[^\w]/g, "").slice(0, 30); if (v !== e.target.value) e.target.value = v; p.score_var = v || "score"; mud(true); };
  $("#sc-zerar").onchange = (e) => { p.zerar = e.target.checked; mud(true); };
  $("#sc-add").onclick = () => {
    if (!candidatas.length) return toast("Adicione perguntas ao formulário antes.", true);
    p.pontuacao.push({ id: FM.uid("r"), juncao: "e", conds: [], pontos: 10 }); mud(); painelScore(pn, p);
  };
  $("#sc-val").onclick = () => {
    if (!numericas.length) return toast("Não há perguntas numéricas (NPS, escala, estrelas, número ou múltipla escolha).", true);
    p.pontuacao.push({ id: FM.uid("r"), tipo: "valor", pergunta: numericas[0].id, fator: 1 }); mud(); painelScore(pn, p);
  };
  $("#sc-op").onclick = () => {
    const comOp = f.perguntas.filter((q) => ["unica", "multipla", "lista", "sim_nao"].includes(q.tipo));
    if (!comOp.length) return toast("Não há perguntas de escolha no formulário.", true);
    modal('<h3>Pontuar as opções de uma pergunta</h3>' + campo("Pergunta", '<select id="po-q">' + comOp.map((q) => '<option value="' + q.id + '">' + h(rotuloQ(q)) + "</option>").join("") + "</select>") +
      '<div id="po-ops"></div><div class="rod"><button data-fechar>Cancelar</button><button class="pri" id="po-ok">Adicionar regras</button></div>', (el, fechar) => {
      const desenha = () => {
        const q = P($("#po-q", el).value);
        $("#po-ops", el).innerHTML = (valoresPossiveis(q) || []).map((v) => '<div class="map" style="grid-template-columns:1fr 110px"><span>' + h(v) + '</span><input data-po="' + h(v) + '" inputmode="decimal" placeholder="pontos"></div>').join("") + '<p class="ajuda">Deixe em branco as opções que não somam pontos.</p>';
      };
      $("#po-q", el).onchange = desenha; desenha();
      $("#po-ok", el).onclick = () => {
        const qid = $("#po-q", el).value;
        let n = 0;
        $$("[data-po]", el).forEach((inp) => { const v = inp.value.trim(); if (!v) return; p.pontuacao.push({ id: FM.uid("r"), juncao: "e", conds: [{ pergunta: qid, op: "igual", valor: inp.dataset.po }], pontos: v.replace(",", ".") }); n++; });
        fechar(); if (n) { mud(); painelScore(pn, p); toast(n + " regra" + (n > 1 ? "s" : "") + " adicionada" + (n > 1 ? "s" : "")); }
      };
    });
  };
  ligarCabBloco(pn, p, i, f);
  renderLogica(p);
}

function painelFaixa(pn, p) {

    $("#fa-lista").innerHTML = (p.faixas.length ? '<div class="fxa-cab"><span>Nome</span><span>De</span><span>Até</span><span>Ir para</span><span></span></div>' : "") +
      p.faixas.map((x, j) => '<div class="fxa" data-j="' + j + '"><input data-fn value="' + h(x.rotulo || "") + '" placeholder="Ex.: Quente"><input data-fmin value="' + h(x.min == null ? "" : x.min) + '" inputmode="decimal" placeholder="sem mín."><input data-fmax value="' + h(x.max == null ? "" : x.max) + '" inputmode="decimal" placeholder="sem máx.">' +
        '<select data-fd><option value="">— ligar depois —</option>' + opcoesDestino(p.id, x.destino, false) + '</select><button class="ico ghost" data-fdel aria-label="Remover faixa">×</button></div>').join("");
    $$(".fxa").forEach((row) => {
      const x = p.faixas[+row.dataset.j];
      $("[data-fn]", row).oninput = (e) => { x.rotulo = e.target.value; mud(); };
      $("[data-fmin]", row).oninput = (e) => { x.min = e.target.value.replace(",", "."); mud(); };
      $("[data-fmax]", row).oninput = (e) => { x.max = e.target.value.replace(",", "."); mud(); };
      $("[data-fd]", row).onchange = (e) => { x.destino = e.target.value; mud(); };
      $("[data-fdel]", row).onclick = () => { p.faixas.splice(+row.dataset.j, 1); mud(); redesenhar(); };
    });
  };
  redesenhar();
  $("#fa-nome").oninput = (e) => { p.titulo = e.target.value; mud(); };
  $("#fa-var").onchange = (e) => { p.score_var = e.target.value; mud(); painelFaixa(pn, p); };
  $("#fa-add").onclick = () => { p.faixas.push({ id: FM.uid("x"), rotulo: "", min: "", max: "", destino: "" }); mud(); redesenhar(); };
  ligarCabBloco(pn, p, i, f);
  renderLogica(p);

    if (!/^[a-z0-9][a-z0-9-]{1,60}$/.test(s)) return toast("Use só letras minúsculas, números e hífen (mín. 2).", true);
    if (s === f.slug) return;
    const { error } = await sb.from("fm_forms").update({ slug: s }).eq("id", f.id);
    if (error) return toast(error.message.includes("duplicate") || error.code === "23505" ? "Esse endereço já está em uso." : "Erro: " + error.message, true);
    f.slug = s; toast("Endereço salvo"); renderCompartilhar();
  };
  const montar = () => {
    const u = new URL(link);
    $$("[data-utm]").forEach((i) => {
      const v = i.value.trim(); if (!v) return;
      if (i.dataset.utm === "_extra") v.split("&").forEach((par) => { const [k, ...r] = par.split("="); if (k) u.searchParams.set(k.trim(), r.join("=").trim()); });
      else u.searchParams.set(i.dataset.utm, v);
    });
    $("#lk-utm").value = u.toString();
  };
  $$("[data-utm]").forEach((i) => i.oninput = montar);
  $("#lk-utm-c").onclick = () => copiar($("#lk-utm").value);
}

function blocoPreencher(f, link) {
  const qs = f.perguntas.filter((q) => FM.paramsDaPergunta(q).length);
  const princ = (q) => { const l = FM.paramsDaPergunta(q); return q.param || (q.tipo === "email" ? "email" : q.tipo === "telefone" ? "telefone" : l.includes("nome") ? "nome" : l[0]); };
  const tagAC = (q) => q.tipo === "email" ? "%EMAIL%" : q.tipo === "telefone" ? "%PHONE%" : FM.paramsDaPergunta(q).some((n) => ["nome", "name", "first_name"].includes(n)) ? "%FIRSTNAME%" : "";
  if (!qs.length) return '<div class="card"><h3>Preencher com dados do lead</h3><p class="ajuda" style="margin:0">Nenhuma pergunta deste formulário pode ser preenchida pela URL. Perguntas de e-mail, telefone e nome são reconhecidas automaticamente; nas outras de texto, defina o parâmetro em “Variável, preenchimento e imagem”.</p></div>';
  const exemplo = link + "?" + qs.map((q) => encodeURIComponent(princ(q)) + "=" + (q.tipo === "email" ? "ana@email.com" : q.tipo === "telefone" ? "51999991234" : "Ana")).join("&");
  const ac = qs.filter(tagAC);

  return '<div class="card"><h3>Preencher com dados do lead <small>a pessoa só confirma e clica em OK</small></h3>' +
    '<div class="tab-wrap" style="margin-bottom:12px"><table><thead><tr><th>Pergunta</th><th>Parâmetros aceitos</th></tr></thead><tbody>' +
    qs.map((q) => "<tr style=\"cursor:default\"><td>" + h(q.titulo || "Sem título") + '</td><td class="mono">' + FM.paramsDaPergunta(q).map(h).join(", ") + "</td></tr>").join("") + "</tbody></table></div>" +
    '<label class="f"><span>Exemplo</span><div class="copy" style="margin:0"><input readonly value="' + h(exemplo) + '"><button data-cp="' + h(exemplo) + '">Copiar</button></div></label>' +
    (linkAC ? '<label class="f"><span>Para e-mails do ActiveCampaign</span><div class="copy" style="margin:0"><input readonly value="' + h(linkAC) + '"><button data-cp="' + h(linkAC) + '">Copiar</button></div><small>As tags %…% são trocadas pelo ActiveCampaign no envio. Se alguma vier vazia, o campo fica em branco para a pessoa digitar.</small></label>' : "") +
    "</div>";
}

// ---------------- RESULTADOS ----------------
const PERIODOS = [["hoje", "Hoje"], ["ontem", "Ontem"], ["7", "Últimos 7 dias"], ["30", "Últimos 30 dias"], ["90", "Últimos 90 dias"], ["tudo", "Todo o período"], ["datas", "Escolher datas…"]];
const pad2 = (n) => String(n).padStart(2, "0");
const ymd = (d) => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
const dmy = (s) => s ? s.split("-").reverse().join("/") : "";
// devolve { desde, ate } em Date (ate = exclusivo) ou null para "todo o período"
function intervalo(R) {
  const meiaNoite = (d) => { d = new Date(d); d.setHours(0, 0, 0, 0); return d; };
  const hoje = meiaNoite(new Date()), amanha = new Date(hoje); amanha.setDate(amanha.getDate() + 1);
  if (R.periodo === "tudo") return null;
  if (R.periodo === "hoje") return { desde: hoje, ate: amanha };
  if (R.periodo === "ontem") { const o = new Date(hoje); o.setDate(o.getDate() - 1); return { desde: o, ate: hoje }; }
  if (R.periodo === "datas") {
    const de = R.de ? new Date(R.de + "T00:00:00") : null;
    let ate = R.ate ? new Date(R.ate + "T00:00:00") : null; if (ate) ate.setDate(ate.getDate() + 1);
    return de || ate ? { desde: de, ate } : null;
  }
  const d = new Date(hoje); d.setDate(d.getDate() - (+R.periodo - 1));
  return { desde: d, ate: null };
}
function rotuloPeriodo(R) {
  if (R.periodo === "datas") {
    if (R.de && R.ate) return R.de === R.ate ? dmy(R.de) : dmy(R.de) + " a " + dmy(R.ate);
    if (R.de) return "a partir de " + dmy(R.de);
    if (R.ate) return "até " + dmy(R.ate);
    return "Todo o período";
  }
  const p = PERIODOS.find((x) => x[0] === R.periodo);
  return p ? p[1] : "";
}
async function carregarRespostas(R) {
  const f = ED.form;
  const iv = intervalo(R);
  const desde = iv && iv.desde, ate = iv && iv.ate;
  const todas = [];
  for (let de = 0; de < 100000; de += 1000) {
    let q = sb.from("fm_respostas").select("id,status,respostas,vistas,atual,final_id,params,dispositivo,iniciado_em,atualizado_em,concluido_em,integracoes").eq("form_id", f.id).order("iniciado_em", { ascending: false }).range(de, de + 999);
    if (desde) q = q.gte("iniciado_em", desde.toISOString());
    if (ate) q = q.lt("iniciado_em", ate.toISOString());
    const { data, error } = await q;
    if (error) throw error;
    todas.push(...data);
    if (data.length < 1000) break;
  }
  return todas;
}

function desenharResultados() {
  const f = ED.form, R = ED.resultados, L = R.linhas;
  const visitas = L.length;
  const inic = L.filter((r) => r.status !== "visita");
  const conc = L.filter((r) => r.status === "concluida");
  const durs = conc.map((r) => (new Date(r.concluido_em) - new Date(r.iniciado_em)) / 1000).filter((s) => s > 0 && s < 86400).sort((a, b) => a - b);
  const mediana = durs.length ? durs[Math.floor(durs.length / 2)] : 0;
  const fmtDur = (s) => !s ? "—" : s < 60 ? Math.round(s) + "s" : Math.floor(s / 60) + "min " + Math.round(s % 60) + "s";
  const temInicio = f.inicio.ativo !== false && (f.inicio.titulo || f.inicio.texto);

  if (!visitas) {

  }

  // ----- funil -----
  const ps = f.perguntas.filter((q) => !FM.ehInterno(q));
  const linhasF = ps.map((q) => {
    const viram = L.filter((r) => (r.vistas || []).includes(q.id)).length;
    const responderam = q.tipo === "aviso" ? L.filter((r) => (r.vistas || []).includes(q.id) && (r.status === "concluida" || r.atual !== q.id)).length : L.filter((r) => !FM.vazio((r.respostas || {})[q.id])).length;
    const sairam = L.filter((r) => r.status !== "concluida" && r.atual === q.id).length;
    return { q, viram, responderam, sairam };
  });
  const sairamInicio = L.filter((r) => r.status === "visita" && !r.atual).length;
  const maxV = Math.max(visitas, 1);
  let pior = null;
  linhasF.forEach((l) => { if (l.viram >= 5 && l.sairam > 0 && (!pior || l.sairam / l.viram > pior.sairam / pior.viram)) pior = l; });
  const nivel = (a, b) => { const p = pct(a, b); return p >= 25 ? "alto" : p >= 10 ? "medio" : ""; };
  let nq = 0;
  const funilHtml = '<div class="card"><h3>Funil de respostas <small>onde as pessoas desistem</small></h3>' +
    '<div class="legenda"><span><i style="background:var(--bar2)"></i>Viram a pergunta</span><span><i style="background:var(--bar1)"></i>Responderam</span><span>Abandono = saíram nessa pergunta ÷ viram</span></div>' +
    (pior && pct(pior.sairam, pior.viram) >= 10 ? '<div class="alerta">Maior ponto de abandono: “' + h(pior.q.titulo || "Sem título") + "” — " + fmtPct(pior.sairam, pior.viram) + " de quem viu saiu ali.</div>" : "") +
    '<div class="funil"><div class="fl cab"><span></span><span>Etapa</span><span></span><span style="text-align:right">Viram → resp.</span><span style="text-align:right">Abandono</span></div>' +
    '<div class="fl"><span class="n">↘</span><span class="q">' + (temInicio ? "Tela de boas-vindas" : "Abriram o formulário") + "<small>visitas</small></span>" +
    '<div class="trilho"><i class="v" style="width:100%"></i><i class="r" style="width:' + pct(inic.length, maxV) + '%"></i><em>' + fmtN(visitas) + "</em></div>" +
    '<span class="num v">' + fmtN(visitas) + "<small>" + fmtN(inic.length) + " começaram</small></span>" +
    '<span style="text-align:right"><span class="aband ' + nivel(sairamInicio, visitas) + '" title="' + fmtN(sairamInicio) + ' saíram sem responder nada">' + fmtPct(sairamInicio, visitas) + "</span></span></div>" +
    linhasF.map((l) => {
      if (l.q.tipo !== "aviso") nq++;
      return '<div class="fl"><span class="n">' + (l.q.tipo === "aviso" ? "i" : nq) + '</span><span class="q" title="' + h(l.q.titulo) + '">' + h(l.q.titulo || "Sem título") + "<small>" + (T[l.q.tipo] || T.curto).nome + "</small></span>" +
        '<div class="trilho"><i class="v" style="width:' + pct(l.viram, maxV) + '%"></i><i class="r" style="width:' + pct(l.responderam, maxV) + '%"></i><em>' + (l.viram ? fmtN(l.viram) : "") + "</em></div>" +
        '<span class="num v">' + fmtN(l.viram) + " → " + fmtN(l.responderam) + "<small>" + (l.viram ? fmtPct(l.responderam, l.viram) + " responderam" : "ninguém chegou") + "</small></span>" +

    f.finais.map((fi) => barh(fi.nome || fi.titulo, porFinal[fi.id] || 0, conc.length)).join("") + "</div>" : "";

  // por dia
  const diasHtml = graficoDias(L);

  // ----- resumo por pergunta -----

  const resumos = FM.varsDoForm(f).map((v) => resumoScore(f, base, v)).join("") + ps.filter(FM.ehPergunta).map((q) => resumoPergunta(q, base)).join("");

  $("#rs-corpo").className = "";

    kpi("Visitas", fmtN(visitas), "abriram o link") +

    kpi("Concluíram", fmtN(conc.length), fmtPct(conc.length, visitas) + " das visitas") +
    kpi("Taxa de conclusão", fmtPct(conc.length, inic.length), "de quem começou") +
    kpi("Tempo mediano", fmtDur(mediana), "para concluir") + "</div>" +
    '<div class="barra"><div class="seg rs-vistas"><button data-vista="tabela" class="' + (R.vista !== "resumo" ? "on" : "") + '">Tabela de respostas</button><button data-vista="resumo" class="' + (R.vista === "resumo" ? "on" : "") + '">Resumo e funil</button></div><div class="esp"></div>' +

      '<input id="rs-busca" placeholder="Buscar em todas as respostas…" value="' + h(R.busca) + '" style="width:260px">' +
      '<select id="rs-st"><option value="respondidas">Concluídas + parciais</option><option value="concluida">Só concluídas</option><option value="parcial">Só parciais</option><option value="visita">Só visitaram</option><option value="todas">Tudo</option></select>') + "</div>" +
    (R.vista === "resumo" ?
      funilHtml +
      '<div class="resumos" style="margin-bottom:14px">' + diasHtml + finaisHtml + "</div>" +
      '<h3 style="font-size:17px;margin:22px 0 12px">Resumo por pergunta</h3>' +
