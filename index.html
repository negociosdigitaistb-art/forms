      : '<div id="rs-tab"></div>');
  $$("[data-vista]").forEach((b) => b.onclick = () => { R.vista = b.dataset.vista; desenharResultados(); });
  $$("[data-flt]").forEach((b) => b.onclick = () => { R.filtro = b.dataset.flt; desenharResultados(); });
  if (R.vista === "resumo") return;
  R.stTab = R.stTab || "respondidas";
  $("#rs-st").value = R.stTab;
  $("#rs-st").onchange = (e) => { R.stTab = e.target.value; R.pagina = 0; tabela(); };
  let bt; $("#rs-busca").oninput = (e) => { clearTimeout(bt); bt = setTimeout(() => { R.busca = e.target.value; R.pagina = 0; tabela(); }, 250); };
  tabela();
}

// valores do Lead Score numa resposta
const scoreDe = (r, v) => { const x = ((r.respostas || {}).__vars || {})[v]; return x == null || x === "" ? null : Number(x); };
const faixaTxt = (r, v) => ((r.respostas || {}).__vars || {})[v + "_faixa"] || "";
const fmtScore = (n) => n == null || isNaN(n) ? "—" : String(Math.round(n * 100) / 100).replace(".", ",");
function resumoScore(f, base, v) {
  const ns = base.map((r) => scoreDe(r, v)).filter((x) => x != null && !isNaN(x)).sort((a, b) => a - b);
  const cab = '<div class="card rq"><h4>Σ Lead Score <span class="mut" style="font-weight:500">{{' + h(v) + '}}</span></h4><div class="sub">' + fmtN(ns.length) + " resposta" + (ns.length === 1 ? "" : "s") + " com score</div>";
  if (!ns.length) return cab + '<p class="mut">Ninguém passou pelo cálculo ainda.</p></div>';
  const media = ns.reduce((a, b) => a + b, 0) / ns.length;
  let html = '<div class="nps-top"><b>' + fmtScore(media) + '</b><span class="mut">média · mín ' + fmtScore(ns[0]) + " · mediana " + fmtScore(ns[Math.floor(ns.length / 2)]) + " · máx " + fmtScore(ns[ns.length - 1]) + "</span></div>";
  const blocoFx = f.perguntas.find((q) => q.tipo === "faixa" && FM.nomeVar(q) === v);
  if (blocoFx) {
    const cont = {}; base.forEach((r) => { const t = faixaTxt(r, v); if (t) cont[t] = (cont[t] || 0) + 1; });
    const tot = Object.values(cont).reduce((a, b) => a + b, 0);
    html += (blocoFx.faixas || []).map((x) => { const nome = x.rotulo || FM.rotuloFaixa(x); return barh(nome + " (" + FM.rotuloFaixa(x) + ")", cont[nome] || 0, tot); }).join("");
  } else {
    const k = Math.min(8, Math.max(3, Math.ceil(Math.sqrt(ns.length)))), mi = ns[0], ma = ns[ns.length - 1], passo = (ma - mi) / k || 1;
    const b = Array(k).fill(0); ns.forEach((x) => b[Math.min(k - 1, Math.floor((x - mi) / passo))]++);
    const mx = Math.max(...b);
    html += '<div class="colunas">' + b.map((c, j) => '<div title="' + fmtScore(mi + j * passo) + "–" + fmtScore(mi + (j + 1) * passo) + ": " + c + '"><i style="height:' + (c / mx * 100) + '%"></i><span>' + fmtScore(Math.round(mi + j * passo)) + "</span></div>").join("") + "</div>";
  }
  return cab + html + "</div>";
}
function kpi(rot, val, sub) { return '<div class="kpi"><span>' + rot + "</span><b>" + val + "</b><small>" + sub + "</small></div>"; }
function barh(rot, n, total) {
  return '<div class="barh"><span class="lb" title="' + h(rot) + '">' + h(rot) + '</span><span class="tr"><i style="width:' + pct(n, Math.max(total, 1)) + '%"></i></span><span class="vl"><b>' + fmtN(n) + "</b> · " + fmtPct(n, total) + "</span></div>";
}

function graficoDias(L) {
  const pad2 = (n) => String(n).padStart(2, "0");
  const diaLocal = (d) => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  const dias = {};
  let menor = null;
  L.forEach((r) => { const dt = new Date(r.iniciado_em); if (isNaN(dt)) return; const d = diaLocal(dt); if (!menor || dt < menor) menor = dt; dias[d] = dias[d] || { v: 0, c: 0 }; dias[d].v++; if (r.status === "concluida") dias[d].c++; });
  if (!menor) return "";
  const serie = [];
  const hoje = diaLocal(new Date());
  for (let d = new Date(menor.getFullYear(), menor.getMonth(), menor.getDate()); serie.length < 120; d.setDate(d.getDate() + 1)) {
    const k = diaLocal(d); serie.push([k, dias[k] || { v: 0, c: 0 }]); if (k >= hoje) break;
  }
  if (!serie.length) return "";
  const W = 560, H = 150, pad = 22, max = Math.max(1, ...serie.map(([, x]) => x.v));
  const bw = (W - pad) / serie.length;
  const bars = serie.map(([k, x], i) => {
    const hv = x.v / max * (H - 30), hc = x.c / max * (H - 30);
    const xx = pad + i * bw + bw * .15, w = Math.max(1, bw * .7);
    return '<g><title>' + k.split("-").reverse().join("/") + ": " + x.v + " visitas, " + x.c + " concluídas</title>" +
      '<rect x="' + xx + '" y="' + (H - 18 - hv) + '" width="' + w + '" height="' + hv + '" rx="2" fill="var(--bar2)"/>' +
      '<rect x="' + xx + '" y="' + (H - 18 - hc) + '" width="' + w + '" height="' + hc + '" rx="2" fill="var(--bar1)"/></g>';
  }).join("");
  const rot = [0, Math.floor(serie.length / 2), serie.length - 1].filter((v, i, a) => a.indexOf(v) === i).map((i) => '<text x="' + (pad + i * bw + bw / 2) + '" y="' + (H - 4) + '" text-anchor="middle">' + serie[i][0].slice(8, 10) + "/" + serie[i][0].slice(5, 7) + "</text>").join("");
  return '<div class="card rq"><h4>Por dia</h4><div class="sub"><span style="color:var(--bar1)">■</span> concluídas &nbsp; <span style="color:var(--bar2)">■</span> visitas</div>' +
    '<svg class="diag" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img" aria-label="Visitas e respostas por dia"><line x1="' + pad + '" x2="' + W + '" y1="' + (H - 18) + '" y2="' + (H - 18) + '"/>' +
    '<text x="0" y="12">' + max + "</text>" + bars + rot + "</svg></div>";
}

function resumoPergunta(q, base) {
  const vals = base.map((r) => (r.respostas || {})[q.id]).filter((v) => !FM.vazio(v));
  const n = vals.length;
  const cab = '<div class="card rq"><h4>' + h(q.titulo || "Sem título") + '</h4><div class="sub">' + (T[q.tipo] || T.curto).nome + " · " + fmtN(n) + " resposta" + (n === 1 ? "" : "s") + (base.length ? " · " + fmtPct(n, base.length) + " responderam" : "") + "</div>";
  if (!n) return cab + '<p class="mut">Nenhuma resposta ainda.</p></div>';
  const t = q.tipo;
  if (["unica", "multipla", "lista", "sim_nao"].includes(t)) {
    const ops = t === "sim_nao" ? ["Sim", "Não"] : (q.opcoes || []).map((o) => o.texto).filter(Boolean);
    const cont = {}; ops.forEach((o) => cont[o] = 0);
    const outros = [];
    vals.forEach((v) => (Array.isArray(v) ? v : [v]).forEach((x) => { if (x in cont) cont[x]++; else { outros.push(x); } }));
    let html = ops.map((o) => [o, cont[o]]).sort((a, b) => b[1] - a[1]).map(([o, c]) => barh(o, c, n)).join("");
    if (outros.length) html += barh("Outro", outros.length, n) + '<div class="textos" style="margin-top:8px">' + outros.slice(0, 30).map((o) => "<p>" + h(o) + "</p>").join("") + "</div>";
    if (t === "multipla") html += '<p class="ajuda">Percentual sobre quem respondeu (cada pessoa pode marcar várias).</p>';
    return cab + html + "</div>";
  }
  if (t === "nps") {
    const ns = vals.map(Number).filter((x) => !isNaN(x));
    const pro = ns.filter((x) => x >= 9).length, neu = ns.filter((x) => x >= 7 && x <= 8).length, det = ns.filter((x) => x <= 6).length;
    const score = Math.round((pro - det) / ns.length * 100);
    const zona = score >= 75 ? "Excelência" : score >= 50 ? "Qualidade" : score >= 0 ? "Aperfeiçoamento" : "Crítica";
    const dist = Array.from({ length: 11 }, (_, i) => ns.filter((x) => x === i).length);
    const mx = Math.max(1, ...dist);
    return cab + '<div class="nps-top"><b>' + (score > 0 ? "+" : "") + score + "</b><span class=\"mut\">NPS · zona de " + zona + "</span></div>" +
      '<div class="nps-faixa"><i style="width:' + pct(det, ns.length) + '%;background:#E5484D"></i><i style="width:' + pct(neu, ns.length) + '%;background:#F5B942"></i><i style="width:' + pct(pro, ns.length) + '%;background:#30A46C"></i></div>' +
      '<div class="nps-leg"><span><i style="background:#E5484D"></i>Detratores ' + fmtPct(det, ns.length) + " (" + det + ")</span><span><i style=\"background:#F5B942\"></i>Neutros " + fmtPct(neu, ns.length) + " (" + neu + ")</span><span><i style=\"background:#30A46C\"></i>Promotores " + fmtPct(pro, ns.length) + " (" + pro + ")</span></div>" +
      '<div class="colunas">' + dist.map((c, i) => '<div title="Nota ' + i + ": " + c + '"><i style="height:' + (c / mx * 100) + "%;background:" + (i <= 6 ? "#E5484D" : i <= 8 ? "#F5B942" : "#30A46C") + '"></i><span>' + i + "</span></div>").join("") + "</div></div>";
  }
  if (["escala", "estrelas", "numero"].includes(t)) {
    const ns = vals.map(Number).filter((x) => !isNaN(x));
    const media = ns.reduce((a, b) => a + b, 0) / Math.max(1, ns.length);
    let html = '<div class="nps-top"><b>' + media.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "</b><span class=\"mut\">média" + (t === "estrelas" ? " de " + (q.escala_max || 5) + " estrelas" : t === "escala" ? " (escala " + (q.escala_min ?? 1) + "–" + (q.escala_max || 5) + ")" : "") + "</span></div>";
    if (t !== "numero") {
      const mi = t === "estrelas" ? 1 : (+q.escala_min || 0), ma = +q.escala_max || 5;
      const dist = []; for (let i = mi; i <= ma; i++) dist.push([i, ns.filter((x) => x === i).length]);
      const mx = Math.max(1, ...dist.map((d) => d[1]));
      html += '<div class="colunas">' + dist.map(([i, c]) => '<div title="' + i + ": " + c + '"><i style="height:' + (c / mx * 100) + '%"></i><span>' + (t === "estrelas" ? i + "★" : i) + "</span></div>").join("") + "</div>";
    } else {
      const s = ns.slice().sort((a, b) => a - b);
      html += '<p class="mut">Mínimo ' + s[0].toLocaleString("pt-BR") + " · Mediana " + s[Math.floor(s.length / 2)].toLocaleString("pt-BR") + " · Máximo " + s[s.length - 1].toLocaleString("pt-BR") + "</p>";
    }
    return cab + html + "</div>";
  }
  // texto
  const comData = base.filter((r) => !FM.vazio((r.respostas || {})[q.id]));
  return cab + '<div class="textos">' + comData.slice(0, 50).map((r) => "<p>" + h(FM.textoResposta(r.respostas[q.id])) + "<small>" + dataHora(r.concluido_em || r.atualizado_em) + "</small></p>").join("") + "</div>" +
    (comData.length > 50 ? '<p class="ajuda">Mostrando as 50 mais recentes. Exporte para ver todas.</p>' : "") + "</div>";
}

function linhasFiltradas() {
  const R = ED.resultados;
  let L = R.linhas;
  if (R.stTab === "respondidas") L = L.filter((r) => r.status !== "visita");
  else if (R.stTab !== "todas") L = L.filter((r) => r.status === R.stTab);
  if (R.busca) {
    const b = FM.norm(R.busca);
    L = L.filter((r) => FM.norm(JSON.stringify(r.respostas) + " " + JSON.stringify(r.params)).includes(b));
  }
  return L;
}

function tabela() {
  const f = ED.form, R = ED.resultados;
  const L = linhasFiltradas();
  const POR = 100;
  const tot = L.length, pags = Math.max(1, Math.ceil(tot / POR));
  R.pagina = Math.min(R.pagina, pags - 1);
  const fatia = L.slice(R.pagina * POR, R.pagina * POR + POR);
  const qs = f.perguntas.filter(FM.ehPergunta);
  const nomeFinal = (id) => { const fi = f.finais.find((x) => x.id === id); return fi ? fi.nome || fi.titulo : ""; };
  const stRot = { concluida: "Concluída", parcial: "Parcial", visita: "Só visitou" };
  if (!tot) { $("#rs-tab").innerHTML = '<div class="card vazio" style="padding:30px">Nenhuma resposta com esse filtro.</div>'; return; }
  const temAc = f.perguntas.some((q) => q.tipo === "active");
  const colsP = paramsAtivos().filter((k) => R.linhas.some((r) => { const v = FM.pegaParam(r.params, k); return v != null && v !== ""; })).slice(0, 8);
  const celAc = (r) => {
    const vs = Object.values(r.integracoes || {});
    if (!vs.length) return '<span class="mut">—</span>';
    return vs.every((v) => v.ok) ? '<span class="pill concluida" title="Enviado">✓ enviado</span>' : '<span class="pill" style="background:var(--err-bg);color:var(--err-fg)" title="' + h(vs.filter((v) => !v.ok).map((v) => v.erro).join("; ")) + '">✕ erro</span>';
  };
  const curto = (t) => { t = String(t || "Sem título").replace(/\s+/g, " ").trim(); return t.length > 42 ? t.slice(0, 42) + "…" : t; };
  const cel = (q, v) => {
    if (FM.vazio(v)) return '<span class="mut">—</span>';
    if (Array.isArray(v)) return v.map((x) => '<span class="chip">' + h(x) + "</span>").join(" ");
    return h(v);
  };
  const vs = FM.varsDoForm(f);
  const temFx = (v) => f.perguntas.some((q) => q.tipo === "faixa" && FM.nomeVar(q) === v);
  $("#rs-tab").innerHTML = '<div class="tab-wrap tab-resp"><table><thead><tr><th class="fixa">#</th><th>Data</th><th>Status</th>' + vs.map((v) => "<th>Σ " + h(v) + "</th>" + (temFx(v) ? "<th>Faixa</th>" : "")).join("") +
    qs.map((q) => '<th title="' + h(q.titulo) + '">' + h(curto(q.titulo)) + "</th>").join("") +
    "<th>Tela final</th><th>Parou em</th>" + colsP.map((k) => '<th title="' + h(k) + '">' + h(nomeParam(k)) + "</th>").join("") + (temAc ? "<th>ActiveCampaign</th>" : "") + "<th>Dispositivo</th></tr></thead><tbody>" +
    fatia.map((r, i) => {
      const parou = r.status !== "concluida" && r.atual ? P(r.atual) : null;
      const pr = r.params || {};
      return '<tr data-id="' + r.id + '"><td class="fixa mut">' + (tot - (R.pagina * POR + i)) + "</td><td>" + dataHora(r.iniciado_em) + '</td><td><span class="pill ' + r.status + '">' + stRot[r.status] + "</span></td>" +
        vs.map((v) => '<td style="font-weight:600;font-variant-numeric:tabular-nums">' + fmtScore(scoreDe(r, v)) + "</td>" + (temFx(v) ? "<td>" + (faixaTxt(r, v) ? '<span class="chip">' + h(faixaTxt(r, v)) + "</span>" : '<span class="mut">—</span>') + "</td>" : "")).join("") +
        qs.map((q) => "<td>" + cel(q, (r.respostas || {})[q.id]) + "</td>").join("") +
        "<td>" + h(nomeFinal(r.final_id)) + '</td><td class="mut">' + (parou ? h(curto(parou.titulo)) : "") + "</td>" +
        colsP.map((k) => { const v = FM.pegaParam(pr, k); return '<td class="mut">' + (v ? h(v) + (pr.origem_lembrada === "sim" ? ' <span title="Origem lembrada de um acesso anterior">↺</span>' : "") : "") + "</td>"; }).join("") +
        (temAc ? "<td>" + celAc(r) + "</td>" : "") + '<td class="mut">' + h(r.dispositivo || "") + "</td></tr>";
    }).join("") +
    "</tbody></table></div>" +
    '<div class="pag">' + fmtN(tot) + " resposta" + (tot === 1 ? "" : "s") + (pags > 1 ? " · página " + (R.pagina + 1) + " de " + pags : "") +
    '<button class="mini" id="pg-a"' + (R.pagina === 0 ? " disabled" : "") + '>‹</button><button class="mini" id="pg-p"' + (R.pagina >= pags - 1 ? " disabled" : "") + ">›</button></div>";
  $("#pg-a").onclick = () => { R.pagina--; tabela(); };
  $("#pg-p").onclick = () => { R.pagina++; tabela(); };
  $$("#rs-tab tbody tr").forEach((tr) => tr.onclick = () => detalhe(R.linhas.find((x) => x.id === tr.dataset.id)));
}

function detalhe(r) {
  const f = ED.form;
  const g = document.createElement("div"); g.className = "gaveta";
  const dur = r.concluido_em ? Math.round((new Date(r.concluido_em) - new Date(r.iniciado_em)) / 1000) : null;
  const fi = f.finais.find((x) => x.id === r.final_id);
  const stRot = { concluida: "Concluída", parcial: "Parcial", visita: "Só visitou" };
  const parou = r.status !== "concluida" && r.atual ? P(r.atual) : null;
  g.innerHTML = '<div role="dialog" aria-modal="true"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><h3 style="flex:1;font-size:18px">Resposta</h3><button class="ico ghost" id="dt-x" aria-label="Fechar">×</button></div>' +
    '<p class="mut" style="margin-bottom:12px"><span class="pill ' + r.status + '">' + stRot[r.status] + "</span> · " + dataHora(r.iniciado_em) + (dur ? " · " + (dur < 60 ? dur + "s" : Math.floor(dur / 60) + "min " + dur % 60 + "s") : "") + (r.dispositivo ? " · " + h(r.dispositivo) : "") + (fi ? " · final: " + h(fi.nome || fi.titulo) : "") + "</p>" +
    (parou ? '<div class="alerta">Parou em: “' + h(parou.titulo) + "”</div>" : "") +
    FM.varsDoForm(f).map((v) => scoreDe(r, v) == null ? "" : '<div class="integ ok" style="background:var(--log-bg);color:var(--log-fg)"><b>Σ</b><span><b>' + h(v) + ": " + fmtScore(scoreDe(r, v)) + "</b>" + (faixaTxt(r, v) ? " · " + h(faixaTxt(r, v)) : "") + "</span></div>").join("") +
    f.perguntas.filter(FM.ehPergunta).map((q) => {
      const v = (r.respostas || {})[q.id];
      return '<div class="resp-item"><span>' + h(q.titulo || "Sem título") + "</span><p>" + (FM.vazio(v) ? '<i class="mut">' + ((r.vistas || []).includes(q.id) ? "não respondeu" : "não viu") + "</i>" : h(FM.textoResposta(v))) + "</p></div>";
    }).join("") +
    (Object.keys(r.integracoes || {}).length ? '<h4 style="margin:18px 0 6px">Integrações</h4>' + Object.entries(r.integracoes).map(([k, v]) =>
      '<div class="integ ' + (v.ok ? "ok" : "erro") + '"><b>' + (v.ok ? "✓" : "✕") + "</b><span><b>" + h(v.nome || "ActiveCampaign") + "</b> · " + (v.ok ? "contato " + h(v.email || "") + " criado/atualizado" + (v.tags ? ", " + v.tags + " tag(s)" : "") + ((v.avisos || []).length ? ". Avisos: " + h(v.avisos.join("; ")) : "") : h(v.erro || "falhou")) + ' <span class="mut">· ' + dataHora(v.em) + "</span></span></div>").join("") : "") +
    (Object.keys(r.params || {}).length ? '<h4 style="margin:18px 0 6px">Origem</h4>' + Object.entries(r.params).map(([k, v]) => '<div class="resp-item" style="padding:6px 0"><span>' + h(k === "origem_lembrada" ? "Origem lembrada de um acesso anterior" : nomeParam(k) === k ? k : nomeParam(k) + " · " + k) + '</span><p class="mono">' + h(v) + "</p></div>").join("") : "") +
    '<div style="margin-top:18px"><button class="mini perigo" id="dt-del">Excluir esta resposta</button></div></div>';
  document.body.appendChild(g);
  const fechar = () => { g.remove(); document.removeEventListener("keydown", tecla); };
  const tecla = (e) => { if (e.key === "Escape") fechar(); };
  document.addEventListener("keydown", tecla);
  g.addEventListener("mousedown", (e) => { if (e.target === g) fechar(); });
  $("#dt-x", g).onclick = fechar;
  $("#dt-del", g).onclick = async () => {
    if (!await confirmar("Excluir esta resposta?", "Excluir", true)) return;
    const { error } = await sb.from("fm_respostas").delete().eq("id", r.id);
    if (error) return toast("Erro: " + error.message, true);
    ED.resultados.linhas = ED.resultados.linhas.filter((x) => x.id !== r.id);
    fechar(); desenharResultados(); toast("Resposta excluída");
  };
}

async function apagarPeriodo() {
  const R = ED.resultados;
  const n = R.linhas.length;
  if (!n) return toast("Não há respostas neste período.");
  if (!await confirmar("Apagar " + fmtN(n) + " registro" + (n > 1 ? "s" : "") + " (" + rotuloPeriodo(R).toLowerCase() + ")? Não dá para desfazer.", "Apagar", true)) return;
  const ids = R.linhas.map((r) => r.id);
  for (let i = 0; i < ids.length; i += 200) {
    const { error } = await sb.from("fm_respostas").delete().in("id", ids.slice(i, i + 200));
    if (error) return toast("Erro: " + error.message, true);
  }
  R.linhas = null; toast("Respostas apagadas"); renderResultados();
}

function tabelaExport() {
  const f = ED.form;
  const qs = f.perguntas.filter(FM.ehPergunta);
  const L = ED.resultados.linhas;
  const todos = [...new Set(L.flatMap((r) => Object.keys(r.params || {})))];
  const ordem = CAP.lista.map((x) => x.chave.toLowerCase());
  const pks = todos.sort((a, b) => { const ia = ordem.indexOf(a.toLowerCase()), ib = ordem.indexOf(b.toLowerCase()); return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.localeCompare(b); });
  const stRot = { concluida: "Concluída", parcial: "Parcial", visita: "Só visitou" };
  const vs = FM.varsDoForm(f);
  const cab = ["Início", "Status", "Concluído em", "Tempo (s)", "Tela final", "Parou em"].concat(vs.flatMap((v) => ["Lead Score (" + v + ")", "Faixa (" + v + ")"])).concat(qs.map((q) => q.titulo || q.chave || q.id)).concat(pks.map((k) => nomeParam(k) === k ? k : nomeParam(k) + " (" + k + ")")).concat(["Dispositivo", "ID"]);
  const linhas = L.filter((r) => r.status !== "visita").map((r) => {
    const fi = f.finais.find((x) => x.id === r.final_id);
    const parou = r.status !== "concluida" && r.atual ? P(r.atual) : null;
    return [new Date(r.iniciado_em), stRot[r.status], r.concluido_em ? new Date(r.concluido_em) : "", r.concluido_em ? Math.round((new Date(r.concluido_em) - new Date(r.iniciado_em)) / 1000) : "",
      fi ? fi.nome || fi.titulo : "", parou ? parou.titulo : ""]
      .concat(vs.flatMap((v) => [scoreDe(r, v) == null ? "" : scoreDe(r, v), faixaTxt(r, v)]))
      .concat(qs.map((q) => { const v = (r.respostas || {})[q.id]; return typeof v === "number" ? v : FM.textoResposta(v); }))
      .concat(pks.map((k) => (r.params || {})[k] || "")).concat([r.dispositivo || "", r.id]);
  });
  return { cab, linhas };
}
function nomeArquivo(ext, base) { return FM.slugify(ED.form.titulo) + "-" + (base || "respostas") + "-" + ymd(new Date()) + "." + ext; }
function exportarCSV() {
  const { cab, linhas } = tabelaExport();
  const cel = (v) => { if (v instanceof Date) v = v.toLocaleString("pt-BR"); v = String(v == null ? "" : v); return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const csv = "﻿" + [cab].concat(linhas).map((l) => l.map(cel).join(";")).join("\r\n");
  baixar(new Blob([csv], { type: "text/csv;charset=utf-8" }), nomeArquivo("csv"));
}
function carregarXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, erro) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"; s.onload = ok; s.onerror = erro; document.head.appendChild(s); });
}
async function exportarExcel() {
  const R = ED.resultados; if (!R || !R.linhas) return;
  try { await carregarXLSX(); } catch (e) { toast("Não carregou o Excel, baixando CSV.", true); return exportarCSV(); }
  const { cab, linhas } = tabelaExport();
  const ws = XLSX.utils.aoa_to_sheet([cab].concat(linhas), { cellDates: true, dateNF: "dd/mm/yyyy hh:mm" });
  ws["!cols"] = cab.map((c, i) => ({ wch: i < 2 ? 17 : Math.min(40, Math.max(12, String(c).length)) }));
  ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: linhas.length, c: cab.length - 1 } }) };
  ws["!freeze"] = { xSplit: 0, ySplit: 1 };
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Respostas");
  // aba de funil
  const f = ED.form, L = R.linhas;
  const fun = [["Etapa", "Viram", "Responderam", "Saíram aqui", "Abandono %"], ["Abriram o formulário", L.length, L.filter((r) => r.status !== "visita").length, L.filter((r) => r.status === "visita" && !r.atual).length, ""]];
  f.perguntas.forEach((q) => {
    if (FM.ehInterno(q)) return;
    const v = L.filter((r) => (r.vistas || []).includes(q.id)).length;
    const re = L.filter((r) => !FM.vazio((r.respostas || {})[q.id])).length;
    const s = L.filter((r) => r.status !== "concluida" && r.atual === q.id).length;
    fun.push([q.titulo || "Sem título", v, q.tipo === "aviso" ? "" : re, s, v ? Math.round(s / v * 1000) / 10 : ""]);
  });
  fun.push(["Concluíram", L.filter((r) => r.status === "concluida").length, "", "", ""]);
  const ws2 = XLSX.utils.aoa_to_sheet(fun); ws2["!cols"] = [{ wch: 50 }, { wch: 10 }, { wch: 12 }, { wch: 12 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, ws2, "Funil");
  XLSX.writeFile(wb, nomeArquivo("xlsx"));
}
function baixar(blob, nome) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}


// ---------------- RELATÓRIO PDF ----------------
function carregarPdfmake() {
  if (window.pdfMake && window.pdfMake.vfs) return Promise.resolve();
  const js = (src) => new Promise((ok, erro) => { const t = document.createElement("script"); t.src = src; t.onload = ok; t.onerror = () => erro(new Error("Não carregou " + src)); document.head.appendChild(t); });
  return js("https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/pdfmake.min.js").then(() => js("https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/vfs_fonts.js"));
}
function opcoesPdf() {
  const R = ED.resultados; if (!R || !R.linhas) return;
  const n = R.linhas.filter((r) => r.status !== "visita").length;
  modal("<h3>Relatório em PDF</h3>" +
    '<p class="mut" style="margin:-8px 0 14px">Período: <b>' + h(rotuloPeriodo(R)) + "</b> · " + fmtN(R.linhas.length) + " visitas, " + fmtN(R.linhas.filter((r) => r.status === "concluida").length) + " concluídas</p>" +
    '<label class="tg"><input type="checkbox" id="pdf-ind" checked> Incluir as respostas de cada pessoa</label>' +
    '<label class="tg"><input type="checkbox" id="pdf-parc"' + (R.filtro === "todas" ? " checked" : "") + "> Incluir respostas parciais (quem não terminou)</label>" +
    (n > 500 ? '<p class="ajuda">Para não ficar gigante, o PDF lista as 500 respostas mais recentes. O Excel traz todas.</p>' : "") +
    '<p id="pdf-st" class="ajuda" style="min-height:18px"></p><div class="rod"><button data-fechar>Cancelar</button><button class="pri" id="pdf-ok">Gerar PDF</button></div>',
    (el, fechar) => {
      $("#pdf-ok", el).onclick = async () => {
        $("#pdf-ok", el).disabled = true; $("#pdf-st", el).textContent = "Montando o relatório…";
        try { await gerarPdf({ individuais: $("#pdf-ind", el).checked, parciais: $("#pdf-parc", el).checked }); fechar(); toast("Relatório baixado"); }
        catch (e) { console.error(e); $("#pdf-st", el).textContent = "Não consegui gerar: " + e.message; $("#pdf-ok", el).disabled = false; }
      };
    });
}

async function gerarPdf(op) {
  await carregarPdfmake();
  const f = ED.form, R = ED.resultados, L = R.linhas;
  const COR = { ink: "#1B1F3B", mut: "#5B6170", linha: "#E6E8EE", fundo: "#F3F4F8", barra: "#2F44C8", barra2: "#C9D0F5", ok: "#1E6B3A", warn: "#7A5310", err: "#8F2756" };
  const tx = (v) => String(v == null ? "" : v).replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, "").trim();
  const resp = (v) => tx(FM.textoResposta(v));
  const visitas = L.length;
  const inic = L.filter((r) => r.status !== "visita");
  const conc = L.filter((r) => r.status === "concluida");
  const base = op.parciais ? inic : conc;
  const qs = f.perguntas.filter(FM.ehPergunta);
  const durs = conc.map((r) => (new Date(r.concluido_em) - new Date(r.iniciado_em)) / 1000).filter((x) => x > 0 && x < 86400).sort((a, b) => a - b);
  const med = durs.length ? durs[Math.floor(durs.length / 2)] : 0;
  const fmtDur = (x) => !x ? "—" : x < 60 ? Math.round(x) + "s" : Math.floor(x / 60) + "min " + Math.round(x % 60) + "s";
  const pctTxt = (a, b) => fmtPct(a, b);
  const barra = (frac, w, frac2) => ({ canvas: [
    { type: "rect", x: 0, y: 2, w, h: 8, r: 3, color: COR.fundo },
    ...(frac2 != null ? [{ type: "rect", x: 0, y: 2, w: Math.max(0.01, w * Math.min(1, frac2)), h: 8, r: 3, color: COR.barra2 }] : []),
    { type: "rect", x: 0, y: 2, w: Math.max(0.01, w * Math.min(1, frac || 0)), h: 8, r: 3, color: COR.barra }
  ] });
  const tabela = { hLineWidth: (i, node) => (i === 0 || i === node.table.body.length ? 0 : 0.5), vLineWidth: () => 0, hLineColor: () => COR.linha,
    paddingTop: () => 4, paddingBottom: () => 4, paddingLeft: () => 4, paddingRight: () => 4 };
  const th = (t, al) => ({ text: t, style: "th", alignment: al || "left" });
  const conteudo = [];

  // cabeçalho
  conteudo.push({ columns: [
    { stack: [{ text: "Relatório de respostas", style: "mut" }, { text: tx(f.titulo), style: "h1" }] },
    { stack: [{ text: "Período: " + rotuloPeriodo(R), alignment: "right" }, { text: "Gerado em " + new Date().toLocaleString("pt-BR"), style: "mut", alignment: "right" }, { text: linkForm(f), style: "mut", alignment: "right", link: linkForm(f) }], width: 240 }
  ], margin: [0, 0, 0, 14] });

  // números
  const kpi = (rot, val, sub) => ({ stack: [{ text: rot, style: "mut" }, { text: val, fontSize: 17, bold: true, margin: [0, 2, 0, 1] }, { text: sub, style: "mut" }], fillColor: COR.fundo });
  conteudo.push({ table: { widths: ["*", "*", "*", "*", "*"], body: [[
    kpi("Visitas", fmtN(visitas), "abriram o link"), kpi("Começaram", fmtN(inic.length), pctTxt(inic.length, visitas) + " das visitas"),
    kpi("Concluíram", fmtN(conc.length), pctTxt(conc.length, visitas) + " das visitas"), kpi("Taxa de conclusão", pctTxt(conc.length, inic.length), "de quem começou"),
    kpi("Tempo mediano", fmtDur(med), "para concluir")]] },
    layout: { hLineWidth: () => 0, vLineWidth: () => 3, vLineColor: () => "#FFFFFF", paddingTop: () => 8, paddingBottom: () => 8, paddingLeft: () => 9, paddingRight: () => 9 } });

  if (!visitas) conteudo.push({ text: "Nenhuma visita neste período.", margin: [0, 20, 0, 0], style: "mut" });
  else {
    // funil
    conteudo.push({ text: "Funil de respostas", style: "h2" }, { text: "Barra clara: viram a pergunta. Barra escura: responderam. Abandono: saíram nessa pergunta ÷ viram.", style: "mut", margin: [0, -4, 0, 6] });
    const corpo = [[th("#"), th("Etapa"), th(""), th("Viram", "right"), th("Resp.", "right"), th("Saíram", "right"), th("Abandono", "right")]];
    const saiuIni = L.filter((r) => r.status === "visita" && !r.atual).length;
    corpo.push(["", "Abriram o formulário", barra(inic.length / visitas, 120, 1), { text: fmtN(visitas), alignment: "right" }, { text: fmtN(inic.length), alignment: "right" }, { text: fmtN(saiuIni), alignment: "right" }, { text: pctTxt(saiuIni, visitas), alignment: "right" }]);
    let n = 0;
    f.perguntas.forEach((q) => {
      if (FM.ehInterno(q)) return;
      const viram = L.filter((r) => (r.vistas || []).includes(q.id)).length;
      const respond = q.tipo === "aviso" ? L.filter((r) => (r.vistas || []).includes(q.id) && (r.status === "concluida" || r.atual !== q.id)).length : L.filter((r) => !FM.vazio((r.respostas || {})[q.id])).length;
      const sairam = L.filter((r) => r.status !== "concluida" && r.atual === q.id).length;
      if (q.tipo !== "aviso") n++;
      const ab = viram ? pct(sairam, viram) : 0;
      corpo.push([{ text: q.tipo === "aviso" ? "i" : String(n), style: "mut" }, tx(q.titulo || "Sem título"), barra(respond / visitas, 120, viram / visitas),
        { text: fmtN(viram), alignment: "right" }, { text: fmtN(respond), alignment: "right" }, { text: fmtN(sairam), alignment: "right" },
        { text: viram ? pctTxt(sairam, viram) : "—", alignment: "right", bold: ab >= 25, color: ab >= 25 ? COR.err : ab >= 10 ? COR.warn : COR.ink }]);
    });
    corpo.push([{ text: "", style: "mut" }, { text: "Concluíram", bold: true }, barra(conc.length / visitas, 120), { text: fmtN(conc.length), alignment: "right", bold: true }, "", "", { text: pctTxt(conc.length, visitas), alignment: "right", style: "mut" }]);
    conteudo.push({ table: { headerRows: 1, widths: [14, "*", 124, 38, 38, 38, 50], body: corpo }, layout: tabela });

    // telas finais
    if (f.finais.length > 1 && conc.length) {
      conteudo.push({ text: "Telas finais", style: "h3" });
      conteudo.push({ table: { widths: ["*", 124, 40, 46], body: f.finais.map((fi) => { const c = conc.filter((r) => r.final_id === fi.id).length; return [tx(fi.nome || fi.titulo), barra(c / conc.length, 120), { text: fmtN(c), alignment: "right" }, { text: pctTxt(c, conc.length), alignment: "right", style: "mut" }]; }) }, layout: tabela });
    }

    // resumo por pergunta
    conteudo.push({ text: "Resumo por pergunta", style: "h2", pageBreak: "before" }, { text: op.parciais ? "Considera concluídas e parciais." : "Considera só quem concluiu.", style: "mut", margin: [0, -4, 0, 4] });
    FM.varsDoForm(f).forEach((v) => {
      const ns = base.map((r) => scoreDe(r, v)).filter((x) => x != null && !isNaN(x)).sort((a, b) => a - b);
      const bl = [{ text: "Lead Score  {{" + v + "}}", style: "h3" }, { text: fmtN(ns.length) + " resposta" + (ns.length === 1 ? "" : "s") + " com score", style: "mut", margin: [0, 0, 0, 4] }];
      if (ns.length) {
        const media = ns.reduce((a, b) => a + b, 0) / ns.length;
        bl.push({ text: [{ text: fmtScore(media), fontSize: 18, bold: true }, { text: "  média · mín " + fmtScore(ns[0]) + " · mediana " + fmtScore(ns[Math.floor(ns.length / 2)]) + " · máx " + fmtScore(ns[ns.length - 1]), style: "mut" }] });
        const bfx = f.perguntas.find((q) => q.tipo === "faixa" && FM.nomeVar(q) === v);
        if (bfx) {
          const cont = {}; base.forEach((r) => { const t = faixaTxt(r, v); if (t) cont[t] = (cont[t] || 0) + 1; });
          const tt = Object.values(cont).reduce((a, b) => a + b, 0) || 1;
          bl.push({ table: { widths: ["*", 124, 34, 46], body: (bfx.faixas || []).map((x) => { const nome = x.rotulo || FM.rotuloFaixa(x); const c = cont[nome] || 0; return [tx(nome) + "  (" + FM.rotuloFaixa(x) + ")", barra(c / tt, 120), { text: fmtN(c), alignment: "right" }, { text: pctTxt(c, tt), alignment: "right", style: "mut" }]; }) }, layout: tabela, margin: [0, 4, 0, 0] });
        }
      } else bl.push({ text: "Ninguém passou pelo cálculo.", style: "mut" });
      conteudo.push({ stack: bl, unbreakable: true, margin: [0, 0, 0, 8] });
    });
    qs.forEach((q, i) => {
      const vals = base.map((r) => (r.respostas || {})[q.id]).filter((v) => !FM.vazio(v));
      const bloco = [{ text: (i + 1) + ". " + tx(q.titulo || "Sem título"), style: "h3" }, { text: (T[q.tipo] || T.curto).nome + " · " + fmtN(vals.length) + " resposta" + (vals.length === 1 ? "" : "s"), style: "mut", margin: [0, 0, 0, 4] }];
      const t = q.tipo;
      if (!vals.length) bloco.push({ text: "Nenhuma resposta.", style: "mut" });
      else if (["unica", "multipla", "lista", "sim_nao"].includes(t)) {
        const ops = t === "sim_nao" ? ["Sim", "Não"] : (q.opcoes || []).map((o) => o.texto).filter(Boolean);
        const cont = {}; ops.forEach((o) => cont[o] = 0); const outros = [];
        vals.forEach((v) => (Array.isArray(v) ? v : [v]).forEach((x) => { if (x in cont) cont[x]++; else outros.push(x); }));
        const linhas = ops.map((o) => [o, cont[o]]).sort((a, b) => b[1] - a[1]);
        if (outros.length) linhas.push(["Outro", outros.length]);
        bloco.push({ table: { widths: ["*", 124, 34, 46], body: linhas.map(([o, c]) => [tx(o), barra(c / vals.length, 120), { text: fmtN(c), alignment: "right" }, { text: pctTxt(c, vals.length), alignment: "right", style: "mut" }]) }, layout: tabela });
        if (outros.length) bloco.push({ text: "Outro: " + outros.slice(0, 20).map(tx).join(" · "), style: "mut", margin: [0, 3, 0, 0] });
      } else if (t === "nps") {
        const ns = vals.map(Number).filter((x) => !isNaN(x));
        const pro = ns.filter((x) => x >= 9).length, neu = ns.filter((x) => x >= 7 && x <= 8).length, det = ns.filter((x) => x <= 6).length;
        const score = Math.round((pro - det) / ns.length * 100);
        bloco.push({ columns: [{ text: (score > 0 ? "+" : "") + score, fontSize: 22, bold: true, width: 70 }, { stack: [{ text: "NPS" }, { text: "Promotores " + pctTxt(pro, ns.length) + " (" + pro + ") · Neutros " + pctTxt(neu, ns.length) + " (" + neu + ") · Detratores " + pctTxt(det, ns.length) + " (" + det + ")", style: "mut" }] }] });
        const dist = Array.from({ length: 11 }, (_, k) => ns.filter((x) => x === k).length), mx = Math.max(1, ...dist);
        bloco.push({ table: { widths: Array(11).fill("*"), body: [dist.map((c) => ({ canvas: [{ type: "rect", x: 2, y: 34 - c / mx * 32, w: 22, h: Math.max(0.5, c / mx * 32), r: 2, color: COR.barra }] })), dist.map((c, k) => ({ text: k + (c ? " (" + c + ")" : ""), style: "mut", alignment: "center" }))] }, layout: "noBorders", margin: [0, 6, 0, 0] });
      } else if (["escala", "estrelas", "numero"].includes(t)) {
        const ns = vals.map(Number).filter((x) => !isNaN(x));
        const media = ns.reduce((a, b) => a + b, 0) / Math.max(1, ns.length);
        bloco.push({ text: [{ text: media.toLocaleString("pt-BR", { maximumFractionDigits: 1 }), fontSize: 18, bold: true }, { text: "  média", style: "mut" }] });
        if (t !== "numero") {
          const mi = t === "estrelas" ? 1 : (+q.escala_min || 0), ma = +q.escala_max || 5, linhas = [];
          for (let k = mi; k <= ma; k++) { const c = ns.filter((x) => x === k).length; linhas.push([t === "estrelas" ? k + " estrela" + (k > 1 ? "s" : "") : String(k), barra(c / ns.length, 120), { text: fmtN(c), alignment: "right" }, { text: pctTxt(c, ns.length), alignment: "right", style: "mut" }]); }
          bloco.push({ table: { widths: ["*", 124, 34, 46], body: linhas }, layout: tabela });
        }
      } else {
        const lista = base.filter((r) => !FM.vazio((r.respostas || {})[q.id])).slice(0, 25);
        bloco.push({ ul: lista.map((r) => ({ text: [resp(r.respostas[q.id]), { text: "  " + dataHora(r.concluido_em || r.atualizado_em), style: "mut" }] })), margin: [0, 2, 0, 0] });
        if (vals.length > 25) bloco.push({ text: "Mostrando 25 de " + vals.length + ". As demais estão nas respostas individuais e no Excel.", style: "mut" });
      }
      conteudo.push({ stack: bloco, unbreakable: vals.length <= 12, margin: [0, 0, 0, 6] });
    });

    // respostas individuais
    if (op.individuais && base.length) {
      const lista = base.slice(0, 500);
      const stRot = { concluida: "Concluída", parcial: "Parcial" };
      conteudo.push({ text: "Respostas individuais", style: "h2", pageBreak: "before" }, { text: fmtN(base.length) + " resposta" + (base.length === 1 ? "" : "s") + (base.length > 500 ? " · mostrando as 500 mais recentes" : ""), style: "mut", margin: [0, -4, 0, 6] });
      lista.forEach((r, i) => {
        const fi = f.finais.find((x) => x.id === r.final_id);
        const parou = r.status !== "concluida" && r.atual ? P(r.atual) : null;
        const pr = r.params || {};
        const origem = paramsAtivos().map((k) => FM.pegaParam(pr, k)).filter(Boolean).slice(0, 4).join(" · ");
        const linhas = qs.filter((q) => !FM.vazio((r.respostas || {})[q.id])).map((q) => [{ text: tx(q.titulo || q.chave || "Pergunta"), style: "mut" }, resp(r.respostas[q.id])]);
        const sc = FM.varsDoForm(f).filter((v) => scoreDe(r, v) != null).map((v) => v + " " + fmtScore(scoreDe(r, v)) + (faixaTxt(r, v) ? " (" + tx(faixaTxt(r, v)) + ")" : "")).join("  ");
        const cab = "#" + (base.length - i) + "   " + dataHora(r.iniciado_em) + "   " + stRot[r.status] + (sc ? "   ·   " + sc : "") + (fi ? "   ·   " + tx(fi.nome || fi.titulo) : "") + (origem ? "   ·   " + tx(origem) : "");
        conteudo.push({ stack: [
          { table: { widths: ["*"], body: [[{ text: cab, bold: true, fillColor: COR.fundo, margin: [2, 1, 2, 1] }]] }, layout: "noBorders" },
          ...(parou ? [{ text: "Parou em: " + tx(parou.titulo), color: COR.warn, margin: [4, 3, 0, 0] }] : []),
          linhas.length ? { table: { widths: [170, "*"], body: linhas }, layout: tabela, margin: [0, 2, 0, 0] } : { text: "Sem respostas.", style: "mut", margin: [4, 3, 0, 0] }
        ], unbreakable: linhas.length <= 14, margin: [0, 0, 0, 10] });
      });
    }
  }

  const dd = {
    pageSize: "A4", pageMargins: [36, 40, 36, 46],
    info: { title: "Relatório — " + tx(f.titulo), author: "TB Forms" },
    defaultStyle: { font: "Roboto", fontSize: 9.5, color: COR.ink, lineHeight: 1.15 },
    styles: { h1: { fontSize: 18, bold: true, margin: [0, 2, 0, 0] }, h2: { fontSize: 13.5, bold: true, margin: [0, 18, 0, 8] }, h3: { fontSize: 10.5, bold: true, margin: [0, 10, 0, 1] }, mut: { color: COR.mut, fontSize: 8.5 }, th: { bold: true, color: COR.mut, fontSize: 8 } },
    footer: (pag, tot) => ({ columns: [{ text: "TB Forms · " + tx(f.titulo) + " · " + rotuloPeriodo(R), style: "mut" }, { text: "Página " + pag + " de " + tot, alignment: "right", style: "mut" }], margin: [36, 16, 36, 0] }),
    content: conteudo
  };
  await new Promise((ok, erro) => { try { pdfMake.createPdf(dd).download(nomeArquivo("pdf", "relatorio"), ok); } catch (e) { erro(e); } });
}

// atalho: Ctrl/Cmd+S salva
document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s" && ED) { e.preventDefault(); salvarAgora(); } });

iniciar();
})();
</script>
