<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TB Forms</title>
<script>try{if(localStorage.getItem("fm_tema")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F6F7FA; --surface:#FFFFFF; --ink:#1B1F3B; --ink2:#2B3040; --muted:#5B6170; --line:#E6E8EE; --line2:#EEF0F4;
    --field:#D9DCE4; --link:#2F44C8; --sel:#F2F4FF; --solid:#1B1F3B; --solid-h:#2A2F55; --pop:#1B1F3B;
    --ok-bg:#DCF5E3; --ok-fg:#1E6B3A; --err-bg:#FBE1EC; --err-fg:#8F2756; --warn-bg:#FCEFD3; --warn-fg:#7A5310; --info-bg:#E3ECFF; --info-fg:#2F44C8; --lil-bg:#EEE6FB; --lil-fg:#5B3AA8;
    --code:#EEF0F4; --shadow:0 12px 32px rgba(15,18,40,.14);
    --bar1:#2F44C8; --bar2:#C9D0F5; --gold:#B8924A;
    --int-bg:#FFE9D6; --int-fg:#B54708;
    --log-bg:#DDF3F1; --log-fg:#0F766E;
  }
  :root[data-theme="dark"] { color-scheme:dark;
    --bg:#0E1117; --surface:#161A23; --ink:#E7E9F0; --ink2:#CDD1DC; --muted:#9CA3B4; --line:#2A303D; --line2:#212632;
    --field:#3A4152; --link:#93A1F7; --sel:#1F2745; --solid:#4C5FDC; --solid-h:#5A6CE6; --pop:#2A3146;
    --ok-bg:#15331F; --ok-fg:#7FD9A0; --err-bg:#3A1826; --err-fg:#F3A0C1; --warn-bg:#382B10; --warn-fg:#EEC56F; --info-bg:#1A2744; --info-fg:#93A1F7; --lil-bg:#2A2145; --lil-fg:#C4A9F5;
    --code:#212632; --shadow:0 12px 32px rgba(0,0,0,.5);
    --bar1:#7C8CF2; --bar2:#2C3555; --gold:#D9B878;
    --int-bg:#3A2414; --int-fg:#F5A86B;
    --log-bg:#133331; --log-fg:#5EEAD4;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font:400 14px/1.45 'Hanken Grotesk',system-ui,-apple-system,Segoe UI,sans-serif; }
  h1,h2,h3,h4 { letter-spacing:-.01em; font-weight:700; }
  a { color:var(--link); }
  .hide { display:none !important; }
  button, .b { font:inherit; font-weight:600; cursor:pointer; border-radius:10px; height:40px; padding:0 16px; border:1px solid var(--field); background:var(--surface); color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap; }
  button:hover, .b:hover { border-color:#B9BECA; }
  button:disabled { opacity:.55; cursor:default; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline:2px solid #4F6BED; outline-offset:2px; }
  .pri { background:var(--solid); color:#fff; border-color:var(--solid); }
  .pri:hover { background:var(--solid-h); border-color:var(--solid-h); }
  a.b.pri { color:#fff; }
  .perigo { color:var(--err-fg); border-color:color-mix(in srgb, var(--err-fg) 35%, var(--surface)); }
  .mini { height:32px; padding:0 10px; font-size:12.5px; border-radius:8px; }
  .ico { width:32px; height:32px; padding:0; border-radius:8px; flex:none; }
  .ghost { border-color:transparent; background:transparent; color:var(--muted); }
  .ghost:hover { background:var(--line2); color:var(--ink); border-color:transparent; }
  input, select, textarea { font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--field); border-radius:10px; padding:0 12px; height:40px; width:100%; }
  textarea { resize:vertical; min-height:64px; height:auto; padding:9px 12px; line-height:1.45; }
  input[type=checkbox], input[type=radio] { width:auto; height:auto; padding:0; accent-color:var(--solid); }
  input[type=color] { padding:3px; width:44px; flex:none; cursor:pointer; }
  label.f { display:block; margin-bottom:14px; }
  label.f > span { display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; color:var(--ink2); }
  label.f small, .ajuda { display:block; color:var(--muted); font-size:12px; margin-top:5px; line-height:1.5; }
  .ajuda code, code { background:var(--code); padding:1px 6px; border-radius:5px; font-size:12px; color:var(--ink2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .g2 { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  .g3 { display:grid; grid-template-columns:repeat(3,1fr); gap:0 12px; }
  .mut { color:var(--muted); }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; }

  /* toggle */
  .tg { display:flex; align-items:center; gap:10px; cursor:pointer; margin-bottom:12px; font-weight:500; user-select:none; }
  .tg input[type=checkbox] { appearance:none; width:34px; height:20px; border-radius:99px; background:var(--field); position:relative; transition:background .15s; cursor:pointer; flex:none; border:0; }
  .tg input[type=checkbox]::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .tg input[type=checkbox]:checked { background:var(--solid); }
  .tg input[type=checkbox]:checked::after { transform:translateX(14px); }

  #login { min-height:100vh; display:grid; place-items:center; padding:20px; }
  #login form { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:28px; }
  #login h1 { font-size:22px; margin:14px 0 4px; }
  #login p { color:var(--muted); margin-bottom:20px; }
  #lerr { color:var(--err-fg) !important; }

  .topbar { position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line); }
  .topbar-in { margin:0 auto; padding:0 20px; display:flex; align-items:center; gap:16px; min-height:60px; }
  .brand { font-weight:700; font-size:16px; letter-spacing:-.01em; display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); }
  .brand-dot { width:28px; height:28px; border-radius:8px; background:var(--solid); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
  .esp { flex:1; }
  .who { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); }
  .tema-ic { width:34px; height:34px; padding:0; flex:none; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); }
  .tema-ic .sol { display:none; } [data-theme="dark"] .tema-ic .sol { display:block; } [data-theme="dark"] .tema-ic .lua { display:none; }

  #view { min-width:0; }
  .pagina { max-width:1240px; margin:0 auto; padding:28px 24px 80px; }
  .topo { display:flex; align-items:center; gap:12px; margin-bottom:22px; flex-wrap:wrap; }
  .topo h1 { font-size:26px; flex:1; min-width:200px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:14px; }
  .card h3 { font-size:15px; margin-bottom:14px; }
  .card h3 small { font-weight:500; color:var(--muted); font-size:12.5px; margin-left:6px; }

  /* lista de formulários */
  .grade { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .fcard { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:10px; cursor:pointer; position:relative; }
  .fcard:hover { border-color:#B9BECA; }
  .fcard h3 { font-size:16px; padding-right:36px; }
  .fcard .meta { color:var(--muted); font-size:12.5px; }
  .fcard .nums { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:12px 0 2px; border-top:1px solid var(--line2); }
  .fcard .nums b { display:block; font-size:19px; }
  .fcard .nums span { color:var(--muted); font-size:12px; }
  .fcard .mais { position:absolute; top:12px; right:12px; }
  .st { font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; display:inline-flex; align-items:center; gap:6px; }
  .st::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .st.publicado { background:var(--ok-bg); color:var(--ok-fg); }
  .st.rascunho { background:var(--line2); color:var(--muted); }
  .st.encerrado { background:var(--warn-bg); color:var(--warn-fg); }
  .vazio { color:var(--muted); text-align:center; padding:60px 20px; }
  .vazio h3 { color:var(--ink); font-size:18px; margin-bottom:6px; }

  /* menu suspenso */
  .menu { position:fixed; z-index:70; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:5px; min-width:180px; }
  .menu button { display:flex; width:100%; justify-content:flex-start; border:0; height:34px; font-weight:500; padding:0 10px; border-radius:7px; background:transparent; }
  .menu button:hover { background:var(--line2); }
  .menu button.perigo { color:var(--err-fg); }

  /* editor */
  .ed-top { position:sticky; top:60px; z-index:15; background:var(--surface); border-bottom:1px solid var(--line); }
  .ed-top-in { display:flex; align-items:center; gap:10px; padding:8px 20px; flex-wrap:wrap; }
  .ed-tit { font-size:16px; font-weight:700; border:1px solid transparent; background:transparent; height:36px; max-width:340px; padding:0 8px; }
  .ed-tit:hover { border-color:var(--line); }
  .ed-tit:focus { border-color:var(--field); background:var(--surface); }
  .abas { display:flex; gap:2px; background:var(--line2); border-radius:10px; padding:3px; }
  .abas a { height:32px; padding:0 13px; display:inline-flex; align-items:center; color:var(--muted); text-decoration:none; font-weight:600; border-radius:8px; white-space:nowrap; font-size:13.5px; }
  .abas a:hover { color:var(--ink); }
  .abas a.on { color:var(--ink); background:var(--surface); box-shadow:0 1px 2px rgba(15,18,40,.08); }
  .salvo { font-size:12.5px; color:var(--muted); min-width:74px; text-align:right; }
  .salvo.erro { color:var(--err-fg); font-weight:600; }

  .construir { display:grid; grid-template-columns:290px minmax(0,1fr) 400px; height:calc(100vh - 113px); }
  .lado { border-right:1px solid var(--line); background:var(--surface); overflow-y:auto; padding:14px 10px 40px; }
  .lado h4 { font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:10px 8px 6px; display:flex; align-items:center; justify-content:space-between; }
  .item { display:flex; align-items:center; gap:10px; padding:8px; border-radius:10px; cursor:pointer; border:1px solid transparent; position:relative; }
  .item:hover { background:var(--line2); }
  .item.on { background:var(--sel); border-color:color-mix(in srgb, var(--link) 30%, transparent); }
  .item .ic { flex:none; width:30px; height:30px; border-radius:8px; display:grid; place-items:center; font-size:13px; font-weight:700; background:var(--info-bg); color:var(--info-fg); }
  .item .ic.t-escolha { background:var(--lil-bg); color:var(--lil-fg); }
  .item .ic.t-avaliacao { background:var(--warn-bg); color:var(--warn-fg); }
  .item .ic.t-contato { background:var(--ok-bg); color:var(--ok-fg); }
  .item .ic.t-outros, .item .ic.t-tela { background:var(--line2); color:var(--muted); }
  .item .ic.t-fim { background:var(--ok-bg); color:var(--ok-fg); }
  .item .tx { flex:1; min-width:0; }
  .item .tx b { display:block; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13.5px; }
  .item .tx small { color:var(--muted); font-size:11.5px; display:flex; gap:6px; align-items:center; }
  .item .n { font-size:11.5px; color:var(--muted); font-weight:700; width:16px; text-align:right; flex:none; }
  .item .logica { color:var(--link); font-weight:700; }
  .item.arrastando { opacity:.4; }
  .item.alvo-cima { box-shadow:inset 0 2px 0 var(--link); }
  .item.alvo-baixo { box-shadow:inset 0 -2px 0 var(--link); }
  .add { width:100%; justify-content:flex-start; border-style:dashed; color:var(--muted); margin-top:6px; height:38px; }
  .add:hover { color:var(--ink); }

  .painel { overflow-y:auto; padding:24px 28px 80px; }
  .painel-in { max-width:640px; margin:0 auto; }
  .painel-cab { display:flex; align-items:center; gap:8px; margin-bottom:18px; }
  .painel-cab h2 { font-size:18px; flex:1; display:flex; align-items:center; gap:10px; }
  .painel-cab .ic { width:32px; height:32px; border-radius:8px; display:grid; place-items:center; font-size:14px; }
  .opcoes { display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
  .opc { display:flex; gap:6px; align-items:center; }
  .opc .l { width:26px; height:26px; flex:none; border-radius:6px; display:grid; place-items:center; font-size:12px; font-weight:700; background:var(--line2); color:var(--muted); }
  .opc input { height:36px; }
  .regra { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .regra-cab { display:flex; align-items:center; justify-content:space-between; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
  .cond { display:grid; grid-template-columns:auto 1.3fr 1fr 1fr auto; gap:6px; align-items:center; margin-bottom:6px; }
  .cond .pre { font-weight:700; font-size:12.5px; color:var(--muted); width:34px; }
  .cond select, .cond input, .destino select { height:36px; font-size:13px; }
  .destino { display:flex; align-items:center; gap:8px; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .destino b { font-size:12.5px; white-space:nowrap; color:var(--link); }
  .juncao { display:inline-flex; gap:2px; background:var(--line2); border-radius:7px; padding:2px; }
  .juncao button { height:24px; padding:0 9px; font-size:11.5px; border:0; border-radius:5px; background:transparent; color:var(--muted); }
  .juncao button.on { background:var(--surface); color:var(--ink); }
  details.mais-op { margin:4px 0 14px; }
  details.mais-op summary { cursor:pointer; font-weight:600; color:var(--muted); font-size:13px; padding:4px 0; }
  details.mais-op[open] summary { margin-bottom:12px; }

  .prev { border-left:1px solid var(--line); background:var(--bg); display:flex; flex-direction:column; padding:14px; gap:10px; min-width:0; }
  .prev-bar { display:flex; align-items:center; gap:6px; }
  .prev-bar span { flex:1; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .prev-moldura { flex:1; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#000; margin:0 auto; width:100%; transition:max-width .25s; box-shadow:0 8px 24px rgba(15,18,40,.08); }
  .prev-moldura.cel { max-width:340px; }
  .prev-moldura iframe { width:100%; height:100%; border:0; display:block; }

  .seg { display:inline-flex; gap:2px; background:var(--line2); border-radius:9px; padding:3px; }
  .seg button { height:28px; padding:0 10px; font-size:12.5px; border:0; border-radius:7px; background:transparent; color:var(--muted); }
  .seg button.on { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(15,18,40,.08); }

  /* tipos (modal) */
  .tipos { display:grid; grid-template-columns:repeat(2,1fr); gap:6px 18px; }
  .tipos h5 { grid-column:1/-1; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:10px 0 2px; }
  .tipos button { justify-content:flex-start; border-color:transparent; background:transparent; font-weight:500; height:40px; padding:0 8px; }
  .tipos button:hover { background:var(--line2); }
  .tipos .ic { width:28px; height:28px; border-radius:7px; display:grid; place-items:center; font-size:12.5px; font-weight:700; }

  /* design */
  .design { display:grid; grid-template-columns:420px minmax(0,1fr); height:calc(100vh - 113px); }
  .design .cfg { overflow-y:auto; padding:22px; border-right:1px solid var(--line); background:var(--surface); }
  .presets { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
  .preset { height:64px; border-radius:10px; border:2px solid var(--line); padding:8px; display:flex; flex-direction:column; justify-content:space-between; align-items:flex-start; cursor:pointer; font-size:11.5px; font-weight:700; }
  .preset.on { border-color:var(--link); }
  .preset i { display:block; width:34px; height:8px; border-radius:99px; }
  .cor { display:flex; gap:8px; align-items:center; }
  .cores { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .cor-linha { display:grid; grid-template-columns:1fr 170px; align-items:center; gap:10px; font-size:13px; font-weight:600; color:var(--ink2); }
  .cor input[type=text] { font-family:ui-monospace,monospace; font-size:13px; text-transform:uppercase; }

  /* compartilhar */
  .copy { display:flex; gap:8px; margin-bottom:10px; }
  .copy input { color:var(--ink2); background:var(--bg); font-family:ui-monospace,monospace; font-size:12.5px; }
  .copy button { height:40px; }
  .statusbox { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .statusbox label { border:1px solid var(--line); border-radius:12px; padding:12px; cursor:pointer; display:flex; gap:10px; align-items:flex-start; }
  .statusbox label:has(input:checked) { border-color:var(--link); background:var(--sel); }
  .statusbox b { display:block; margin-bottom:2px; }
  .statusbox small { color:var(--muted); font-size:12px; line-height:1.4; display:block; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; overflow:auto; font-size:12px; color:var(--ink2); white-space:pre-wrap; word-break:break-all; }

  /* resultados */
  .kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:14px; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .kpi span { color:var(--muted); font-size:12.5px; font-weight:600; }
  .kpi b { display:block; font-size:28px; font-weight:700; margin-top:2px; letter-spacing:-.01em; }
  .kpi small { color:var(--muted); font-size:12px; }
  .funil { display:flex; flex-direction:column; gap:4px; }
  .fl { display:grid; grid-template-columns:28px minmax(0,2.2fr) minmax(0,3fr) 90px 92px; gap:12px; align-items:center; padding:8px 6px; border-radius:8px; }
  .fl:hover { background:var(--bg); }
  .fl.cab { font-size:11.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding-top:0; }
  .fl.cab:hover { background:transparent; }
  .fl .n { color:var(--muted); font-weight:700; font-size:12.5px; text-align:right; }
  .fl .q { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }
  .fl .q small { display:block; color:var(--muted); font-weight:400; font-size:11.5px; }
  .trilho { position:relative; height:22px; background:var(--line2); border-radius:6px; overflow:hidden; }
  .trilho i { position:absolute; left:0; top:0; bottom:0; border-radius:6px; }
  .trilho i.v { background:var(--bar2); }
  .trilho i.r { background:var(--bar1); }
  .trilho em { position:absolute; left:8px; top:0; line-height:22px; font-size:11.5px; font-style:normal; font-weight:700; color:#fff; mix-blend-mode:normal; text-shadow:0 0 3px rgba(0,0,0,.35); }
  .fl .num { text-align:right; font-variant-numeric:tabular-nums; font-size:13px; }
  .fl .num small { display:block; color:var(--muted); font-size:11.5px; }
  .aband { display:inline-block; font-size:12px; font-weight:700; padding:3px 8px; border-radius:99px; background:var(--line2); color:var(--muted); }
  .aband.alto { background:var(--err-bg); color:var(--err-fg); }
  .aband.medio { background:var(--warn-bg); color:var(--warn-fg); }
  .legenda { display:flex; gap:16px; font-size:12px; color:var(--muted); margin-bottom:10px; flex-wrap:wrap; }
  .legenda i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .alerta { background:var(--warn-bg); color:var(--warn-fg); border-radius:10px; padding:10px 14px; font-weight:500; margin-bottom:12px; font-size:13.5px; }
  .resumos { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .rq h4 { font-size:14px; margin-bottom:2px; }
  .rq .sub { color:var(--muted); font-size:12px; margin-bottom:14px; }
  .barh { display:grid; grid-template-columns:minmax(0,1fr) 110px 96px; gap:10px; align-items:center; margin-bottom:8px; font-size:13px; }
  .barh .lb { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .barh .tr { height:10px; background:var(--line2); border-radius:99px; overflow:hidden; }
  .barh .tr i { display:block; height:100%; background:var(--bar1); border-radius:99px; }

    <a class="brand" href="#/"><span class="brand-dot">TF</span>TB Forms</a>
    <div class="esp"></div>
    <div class="who">
      <button class="tema-ic" id="tema" title="Tema claro/escuro" aria-label="Alternar tema">
        <svg class="lua" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sol" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script src="/core.js"></script>
<script>
(function () {
"use strict";
const CFG = window.FM_CONFIG;
const sb = window.supabase.createClient(CFG.url, CFG.anon);
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => [...(el || document).querySelectorAll(s)];
const h = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const view = $("#view");
const T = FM.TIPOS;
const LETRAS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const GRUPO_CLS = { Texto: "t-texto", Contato: "t-contato", Escolha: "t-escolha", "Avaliação": "t-avaliacao", Outros: "t-outros", "Integrações": "t-integ", "Lógica": "t-logica" };
const GRUPO_COR = { Texto: "info", Contato: "ok", Escolha: "lil", "Avaliação": "warn", Outros: "line2", "Integrações": "int", "Lógica": "log" };
const fmtN = (n) => Number(n || 0).toLocaleString("pt-BR");
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
const fmtPct = (a, b) => (b ? pct(a, b).toLocaleString("pt-BR") : "0") + "%";

// ---------------- utilidades de interface ----------------
let toastT;
function toast(msg, erro) {
  let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.className = erro ? "erro" : ""; t.style.display = "block";
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = "none", 2800);
}
function modal(html, aoMontar) {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = '<div role="dialog" aria-modal="true">' + html + "</div>";
  document.body.appendChild(m);
  const fechar = () => { m.remove(); document.removeEventListener("keydown", tecla); };
  const tecla = (e) => { if (e.key === "Escape") fechar(); };
  document.addEventListener("keydown", tecla);
  m.addEventListener("mousedown", (e) => { if (e.target === m) fechar(); });
  $$("[data-fechar]", m).forEach((b) => b.onclick = fechar);
  if (aoMontar) aoMontar(m.firstChild, fechar);
  const f = $("input, textarea, select", m); if (f) setTimeout(() => f.focus(), 30);
  return fechar;
}
function confirmar(msg, botao, perigo) {
  return new Promise((ok) => {
    modal('<h3>' + h(msg) + '</h3><div class="rod"><button data-fechar>Cancelar</button><button class="' + (perigo ? "pri perigo" : "pri") + '" id="sim">' + h(botao || "Confirmar") + "</button></div>",
      (el, fechar) => { $("#sim", el).onclick = () => { fechar(); ok(true); }; $("[data-fechar]", el).addEventListener("click", () => ok(false)); });
  });
}
function menu(ancora, itens) {
  $$(".menu").forEach((m) => m.remove());
  const m = document.createElement("div"); m.className = "menu";
  m.innerHTML = itens.map((it, i) => '<button data-i="' + i + '" class="' + (it.perigo ? "perigo" : "") + '">' + h(it.rot) + "</button>").join("");
  document.body.appendChild(m);
  const r = ancora.getBoundingClientRect();
  m.style.top = Math.min(r.bottom + 4, innerHeight - m.offsetHeight - 8) + "px";
  m.style.left = Math.max(8, Math.min(r.right - m.offsetWidth, innerWidth - m.offsetWidth - 8)) + "px";
  m.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; m.remove(); itens[+b.dataset.i].fn(); };
  setTimeout(() => document.addEventListener("mousedown", function f(e) { if (!m.contains(e.target)) { m.remove(); document.removeEventListener("mousedown", f); } }), 0);
}
function tempoRel(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "agora";
  if (s < 3600) return "há " + Math.floor(s / 60) + " min";
  if (s < 86400) return "há " + Math.floor(s / 3600) + " h";
  if (s < 86400 * 30) return "há " + Math.floor(s / 86400) + " d";
  return new Date(iso).toLocaleDateString("pt-BR");
}
const dataHora = (iso) => iso ? new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
async function copiar(txt) {
  try { await navigator.clipboard.writeText(txt); toast("Copiado!"); }
  catch (e) { const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); toast("Copiado!"); }
}
const baseUrl = () => location.origin;
const linkForm = (f) => baseUrl() + "/f/" + f.slug;

// ---------------- autenticação ----------------
$("#tema").onclick = () => {
  const d = document.documentElement.dataset.theme === "dark";
  if (d) delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = "dark";
  try { localStorage.setItem("fm_tema", d ? "light" : "dark"); } catch (e) {}
};
$("#lf").onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  $("#lerr").textContent = "Entrando…";
  const { error } = await sb.auth.signInWithPassword({ email: fd.get("email"), password: fd.get("senha") });
  if (error) { $("#lerr").textContent = "E-mail ou senha incorretos."; return; }
  $("#lerr").textContent = "";
  iniciar();
};
$("#sair").onclick = async () => { await sb.auth.signOut(); location.hash = "#/"; location.reload(); };

async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("#login").classList.remove("hide"); $("#app").classList.add("hide"); return; }
  const { data: adm } = await sb.rpc("fm_is_admin");
  if (!adm) {
    $("#login").classList.remove("hide"); $("#app").classList.add("hide");
    $("#lerr").textContent = "Esse usuário não tem acesso ao TB Forms. Peça para alguém da equipe te cadastrar em Usuários."; await sb.auth.signOut(); return;
  }
  $("#login").classList.add("hide"); $("#app").classList.remove("hide");
  $("#quem").textContent = session.user.email;
  EU = session.user;
  try { await carregarCaptura(); } catch (e) {}
  rotear();
}
window.addEventListener("hashchange", () => rotear());

// ---------------- roteamento ----------------
let ED = null; // estado do editor
let EU = null; // usuário logado
let CAP = FM.capturaConfig(null); // parâmetros do link capturados (Configurações)
async function carregarCaptura() {
  const { data } = await sb.from("fm_ajustes").select("valor").eq("chave", "parametros").maybeSingle();
  CAP = FM.capturaConfig(data && data.valor);
  return CAP;
}
const nomeParam = (k) => { if (k === "origem_lembrada") return "Origem lembrada"; if (k === "referrer") return "Veio do site"; const x = CAP.lista.find((y) => y.chave.toLowerCase() === String(k).toLowerCase()); return x && x.nome ? x.nome : k; };
const paramsAtivos = () => CAP.lista.filter((x) => x.ativo).map((x) => x.chave);
async function rotear() {
  const p = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (p[0] === "f" && p[1]) {
    const aba = p[2] || "construir";
    if (!ED || ED.form.id !== p[1]) {
      if (ED) await salvarAgora();
      view.innerHTML = '<div class="pagina mut">Carregando…</div>';
      const { data, error } = await sb.from("fm_forms").select("*").eq("id", p[1]).maybeSingle();
      if (error || !data) { view.innerHTML = '<div class="pagina"><div class="vazio"><h3>Formulário não encontrado</h3><a href="#/">Voltar para a lista</a></div></div>'; return; }
      ED = { form: normalizar(data), sel: null, aba, dirty: false, timer: null, prevTimer: null, salvando: null, resultados: null, cel: false };
      ED.sel = ED.form.perguntas[0] ? ED.form.perguntas[0].id : (ED.form.inicio.ativo !== false ? "inicio" : null);
    }
    ED.aba = aba;
    return renderEditor();
  }
  if (ED) { await salvarAgora(); ED = null; }
  if (p[0] === "usuarios") return renderUsuarios();
  if (p[0] === "config") return renderConfig();
  renderLista();
}
window.addEventListener("beforeunload", (e) => { if (ED && ED.dirty) { salvarAgora(); e.preventDefault(); e.returnValue = ""; } });

function normalizar(f) {
  f.perguntas = Array.isArray(f.perguntas) ? f.perguntas : [];
  f.inicio = f.inicio || {};
  f.finais = Array.isArray(f.finais) && f.finais.length ? f.finais : [novoFinal("Obrigado!")];
  f.tema = f.tema || {};
  f.config = f.config || {};
  return f;
}
function novoFinal(titulo) {
  return { id: FM.uid("f"), nome: titulo || "Final", titulo: titulo || "Obrigado!", texto: "Sua resposta foi enviada.", botao_texto: "", botao_url: "", redirecionar: "", segundos: 3, repassar_params: false, mostrar_icone: true };
}

// ---------------- USUÁRIOS ----------------
async function funcUsuarios(corpo) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error("Faça login de novo.");
  const r = await fetch(CFG.url + "/functions/v1/fm-usuarios", {
    method: "POST", headers: { Authorization: "Bearer " + session.access_token, apikey: CFG.anon, "Content-Type": "application/json" },
    body: JSON.stringify(corpo)
  });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok || !d.ok) throw new Error(d.erro || "Não foi possível concluir (" + r.status + ").");
  return d;
}
function gerarSenha() {
  const c = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const a = new Uint32Array(10); crypto.getRandomValues(a);
  return Array.from(a, (x) => c[x % c.length]).join("");
}
const campoSenha = (id, rot, ajuda) => '<label class="f"><span>' + rot + '</span><div style="display:flex;gap:8px"><input id="' + id + '" type="text" autocomplete="new-password" minlength="8" spellcheck="false" class="mono">' +
  '<button type="button" class="mini" data-gerar="' + id + '" style="height:40px">Gerar</button></div>' + (ajuda ? "<small>" + ajuda + "</small>" : "") + "</label>";
function ligarGerar(el) { $$("[data-gerar]", el).forEach((b) => b.onclick = () => { $("#" + b.dataset.gerar, el).value = gerarSenha(); }); }
function textoAcesso(email, senha) { return "Acesso ao TB Forms\nEndereço: " + location.origin + "\nE-mail: " + email + "\nSenha: " + senha; }
function mostrarAcesso(titulo, email, senha, obs) {
  const txt = textoAcesso(email, senha);
  modal("<h3>" + h(titulo) + '</h3><pre style="font-size:13px">' + h(txt) + "</pre>" + (obs ? '<p class="ajuda" style="margin-top:10px">' + obs + "</p>" : "") +
    '<div class="rod"><button data-fechar>Fechar</button><button class="pri" id="cp-acesso">Copiar acesso</button></div>',
    (el) => { $("#cp-acesso", el).onclick = () => copiar(txt); });
}

async function renderUsuarios() {
  view.innerHTML = '<div class="pagina" style="max-width:900px"><div class="topo"><h1>Usuários</h1><button class="pri" id="u-novo">+ Novo usuário</button></div>' +
    '<p class="mut" style="margin:-10px 0 18px">Quem está aqui entra no TB Forms com e-mail e senha e pode criar, editar e ver os resultados de todos os formulários.</p><div id="u-lista" class="mut">Carregando…</div></div>';
  $("#u-novo").onclick = novoUsuario;
  const { data, error } = await sb.from("fm_usuarios").select("user_id,nome,email,criado_em").order("criado_em");
  if (error) { $("#u-lista").innerHTML = '<p style="color:var(--err-fg)">Erro ao carregar: ' + h(error.message) + "</p>"; return; }
  $("#u-lista").className = "";
  $("#u-lista").innerHTML = '<div class="tab-wrap u-tab"><table><thead><tr><th>Nome</th><th>E-mail (login)</th><th>Desde</th><th></th></tr></thead><tbody>' +
    data.map((u) => '<tr style="cursor:default"><td><b style="font-weight:600">' + h(u.nome || "—") + "</b>" + (EU && u.user_id === EU.id ? ' <span class="pill visita">você</span>' : "") + "</td><td>" + h(u.email) + '</td><td class="mut">' + new Date(u.criado_em).toLocaleDateString("pt-BR") + "</td>" +
      '<td class="u-acoes"><button class="mini" data-senha="' + u.user_id + '">Trocar senha</button> ' +
      (EU && u.user_id === EU.id ? "" : '<button class="mini perigo" data-rem="' + u.user_id + '">Remover acesso</button>') + "</td></tr>").join("") +
    "</tbody></table></div>";
  $$("[data-senha]").forEach((b) => b.onclick = () => trocarSenhaDe(data.find((u) => u.user_id === b.dataset.senha)));
  $$("[data-rem]").forEach((b) => b.onclick = async () => {
    const u = data.find((x) => x.user_id === b.dataset.rem);
    if (!await confirmar("Remover o acesso de " + (u.nome || u.email) + " ao TB Forms?", "Remover acesso", true)) return;
    try { await funcUsuarios({ acao: "remover", usuario_id: u.user_id }); toast("Acesso removido"); renderUsuarios(); }
    catch (e) { toast(e.message, true); }
  });
}

function novoUsuario() {
  modal("<h3>Novo usuário</h3>" +
    '<label class="f"><span>Nome</span><input id="nu-nome" maxlength="80" placeholder="Ex.: Angélica"></label>' +
    '<label class="f"><span>E-mail (é o login)</span><input id="nu-email" type="email" autocomplete="off" placeholder="nome@empresa.com"></label>' +
    campoSenha("nu-senha", "Senha", "Mínimo de 8 caracteres. Se esse e-mail já tiver login no Disparador ou no Webnario, o acesso é liberado e a senha dele continua a mesma.") +
    '<p id="nu-erro" style="color:var(--err-fg);min-height:18px;font-size:13px"></p>' +
    '<div class="rod"><button data-fechar>Cancelar</button><button class="pri" id="nu-ok">Criar usuário</button></div>',
    (el, fechar) => {
      ligarGerar(el); $("#nu-senha", el).value = gerarSenha();
      $("#nu-ok", el).onclick = async () => {
        const nome = $("#nu-nome", el).value.trim(), email = $("#nu-email", el).value.trim().toLowerCase(), senha = $("#nu-senha", el).value;
        if (!nome) return $("#nu-erro", el).textContent = "Informe o nome.";
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return $("#nu-erro", el).textContent = "E-mail inválido.";
        if (senha.length < 8) return $("#nu-erro", el).textContent = "A senha precisa ter pelo menos 8 caracteres.";
        $("#nu-ok", el).disabled = true; $("#nu-erro", el).textContent = "";
        try {
          const r = await funcUsuarios({ acao: "criar", nome, email, senha });
          fechar(); renderUsuarios();
          if (r.ja_existia) modal('<h3>Acesso liberado</h3><p>' + h(email) + ' já tinha login (Disparador/Webnario). Agora também entra no TB Forms, com a mesma senha de sempre.</p><div class="rod"><button class="pri" data-fechar>Ok</button></div>');
          else mostrarAcesso("Usuário criado", email, senha, "Mande esses dados para a pessoa. A senha não fica visível depois que você fechar esta janela.");
        } catch (e) { $("#nu-erro", el).textContent = e.message; $("#nu-ok", el).disabled = false; }
      };
    });
}

function trocarSenhaDe(u) {
  const souEu = EU && u.user_id === EU.id;
  modal("<h3>Trocar senha de " + h(u.nome || u.email) + "</h3>" + campoSenha("ts-senha", "Nova senha", "Mínimo de 8 caracteres. Vale também para o Disparador e o Webnario, que usam o mesmo login.") +
    '<p id="ts-erro" style="color:var(--err-fg);min-height:18px;font-size:13px"></p><div class="rod"><button data-fechar>Cancelar</button><button class="pri" id="ts-ok">Salvar senha</button></div>',
    (el, fechar) => {
      ligarGerar(el); $("#ts-senha", el).value = gerarSenha();
      $("#ts-ok", el).onclick = async () => {
        const senha = $("#ts-senha", el).value;
        if (senha.length < 8) return $("#ts-erro", el).textContent = "A senha precisa ter pelo menos 8 caracteres.";
        $("#ts-ok", el).disabled = true;
        try {
          if (souEu) { const { error } = await sb.auth.updateUser({ password: senha }); if (error) throw error; }
          else await funcUsuarios({ acao: "senha", usuario_id: u.user_id, senha });
          fechar();
          if (souEu) toast("Sua senha foi trocada"); else mostrarAcesso("Senha trocada", u.email, senha, "Mande a nova senha para a pessoa.");
        } catch (e) { $("#ts-erro", el).textContent = e.message || String(e); $("#ts-ok", el).disabled = false; }
      };
    });
}

function minhaSenha() {
  modal('<h3>Minha senha</h3><label class="f"><span>Nova senha</span><input id="ms-1" type="password" autocomplete="new-password" minlength="8"></label>' +
    '<label class="f"><span>Repita a nova senha</span><input id="ms-2" type="password" autocomplete="new-password"></label><p class="ajuda" style="margin:-6px 0 8px">Vale também para o Disparador e o Webnario.</p>' +
    '<p id="ms-erro" style="color:var(--err-fg);min-height:18px;font-size:13px"></p><div class="rod"><button data-fechar>Cancelar</button><button class="pri" id="ms-ok">Salvar</button></div>',
    (el, fechar) => {
      $("#ms-ok", el).onclick = async () => {
        const a = $("#ms-1", el).value, b = $("#ms-2", el).value;
        if (a.length < 8) return $("#ms-erro", el).textContent = "A senha precisa ter pelo menos 8 caracteres.";
        if (a !== b) return $("#ms-erro", el).textContent = "As duas senhas não são iguais.";
        $("#ms-ok", el).disabled = true;
        const { error } = await sb.auth.updateUser({ password: a });
        if (error) { $("#ms-erro", el).textContent = error.message; $("#ms-ok", el).disabled = false; return; }
        fechar(); toast("Senha trocada");
      };
    });
}
$("#minha-senha").onclick = minhaSenha;
$("#nav-menu").onclick = (e) => menu(e.currentTarget, [
  { rot: "Formulários", fn: () => location.hash = "#/" },
  { rot: "Usuários", fn: () => location.hash = "#/usuarios" },
  { rot: "Configurações", fn: () => location.hash = "#/config" },
  { rot: "Minha senha", fn: minhaSenha }
]);

// ---------------- modelos ----------------
const TEMA_PADRAO = { fundo: "#0a0b0c", texto: "#F2EEE6", destaque: "#C9A96E", fonte: "Hanken Grotesk" };
function modelo(tipo) {
  const q = (o) => Object.assign({ id: FM.uid("q"), obrigatorio: false, regras: [], depois: "" }, o);
  const op = (...txt) => txt.map((t) => ({ id: FM.uid("o"), texto: t }));
  if (tipo === "nps") {
    const f1 = novoFinal("Obrigado pela resposta!"); f1.nome = "Obrigado"; f1.texto = "Sua opinião ajuda a gente a melhorar todo dia.";
    const f2 = novoFinal("Show! Vamos te chamar 🙌"); f2.nome = "Topou depoimento"; f2.texto = "Nosso time vai te chamar no WhatsApp para combinar o depoimento.";
    const nota = q({ tipo: "nps", titulo: "De 0 a 10, o quanto você indicaria a gente para um amigo?", obrigatorio: true, chave: "nota" });
    const det = q({ tipo: "longo", titulo: "Poxa, sentimos muito. O que fez você dar essa nota?", chave: "motivo_detrator" });
    const neu = q({ tipo: "longo", titulo: "O que faltou para ser um 10?", chave: "motivo_neutro" });
    const pro = q({ tipo: "longo", titulo: "Que bom! O que você mais gostou?", chave: "motivo_promotor" });
    const dep = q({ tipo: "sim_nao", titulo: "Topa gravar um depoimento curtinho contando sua experiência?", chave: "depoimento" });
    const tel = q({ tipo: "telefone", titulo: "Qual seu WhatsApp? (com DDD)", descricao: "Só para a gente te chamar, prometo não mandar spam.", chave: "whatsapp" });
    nota.regras = [
      { id: FM.uid("r"), conds: [{ pergunta: nota.id, op: "maior_igual", valor: "9" }], juncao: "e", destino: pro.id },
      { id: FM.uid("r"), conds: [{ pergunta: nota.id, op: "menor_igual", valor: "6" }], juncao: "e", destino: det.id }
    ];
    nota.depois = neu.id;
    det.depois = "fim:" + f1.id; neu.depois = "fim:" + f1.id;
    dep.regras = [{ id: FM.uid("r"), conds: [{ pergunta: dep.id, op: "igual", valor: "Sim" }], juncao: "e", destino: tel.id }];
    dep.depois = "fim:" + f1.id;
    tel.depois = "fim:" + f2.id; tel.obrigatorio = true;
    return { perguntas: [nota, det, neu, pro, dep, tel], finais: [f1, f2], inicio: { ativo: true, titulo: "Sua opinião vale ouro", texto: "São só 3 perguntas rápidas.", botao: "Bora", tempo: "1 minuto" } };
  }
  if (tipo === "perfil") {
    const nome = q({ tipo: "curto", titulo: "Pra começar, qual seu nome?", obrigatorio: true, chave: "nome" });
    const tempo = q({ tipo: "unica", titulo: "Prazer, {{nome}}! Há quanto tempo você trabalha com marketing digital?", obrigatorio: true, chave: "tempo", opcoes: op("Ainda não comecei", "Menos de 6 meses", "De 6 meses a 2 anos", "Mais de 2 anos") });

  view.innerHTML = '<div class="pagina"><div class="topo"><h1>Formulários</h1><button class="pri" id="novo">+ Novo formulário</button></div><div id="lista" class="mut">Carregando…</div></div>';

  const [{ data: forms, error }, { data: res }] = await Promise.all([

  ]);

      '<button class="ico ghost mais" data-mais="' + f.id + '" aria-label="Mais ações">⋯</button>' +

      "<h3>" + h(f.titulo) + "</h3>" +
      '<div class="meta">' + nq + " pergunta" + (nq === 1 ? "" : "s") + " · editado " + tempoRel(f.atualizado_em) + (r.ultima ? " · última resposta " + tempoRel(r.ultima) : "") + "</div>" +
      '<div class="nums"><div><b>' + fmtN(r.visitas) + "</b><span>Visitas</span></div><div><b>" + fmtN(r.concluidas) + "</b><span>Respostas</span></div><div><b>" + fmtPct(r.concluidas, r.iniciadas) + "</b><span>Conclusão</span></div></div>" +

  }).join("");
  $$(".fcard").forEach((c) => c.onclick = (e) => {

    menu(b, [

    ]);

async function slugLivre(base) {
  base = FM.slugify(base);
  for (let i = 0; i < 6; i++) {
    const s = i === 0 ? base : base.slice(0, 34) + "-" + Math.random().toString(36).slice(2, 6);
    const { data } = await sb.from("fm_forms").select("id").eq("slug", s).maybeSingle();
    if (!data && s.length >= 2) return s;
  }
  return "form-" + Date.now().toString(36);
}

function novoForm() {
  modal('<h3>Novo formulário</h3>' +
    '<label class="f"><span>Nome</span><input id="nf-nome" placeholder="Ex.: Pesquisa de satisfação novembro" maxlength="120"></label>' +
    '<span style="display:block;font-size:12.5px;font-weight:600;margin-bottom:8px;color:var(--ink2)">Começar com</span>' +
    '<div class="modelos">' +
    '<label><input type="radio" name="mod" value="nps" checked><b>Pesquisa NPS</b><small>Nota de 0 a 10 com perguntas diferentes para promotores, neutros e detratores.</small></label>' +
    '<label><input type="radio" name="mod" value="perfil"><b>Perfil do aluno</b><small>Experiência, faturamento e desafios, com lógica condicional.</small></label>' +
    '<label><input type="radio" name="mod" value="evento"><b>Feedback de evento/aula</b><small>Estrelas, escala de utilidade e sugestões.</small></label>' +
    '<label><input type="radio" name="mod" value="branco"><b>Em branco</b><small>Comece do zero.</small></label>' +

      $("#nf-ok", el).onclick = async () => {

        const titulo = $("#nf-nome", el).value.trim() || nomes[mod];
        $("#nf-ok", el).disabled = true;
        const m = modelo(mod);
        const slug = await slugLivre(titulo);
        const { data, error } = await sb.from("fm_forms").insert({
          titulo, slug, perguntas: m.perguntas, finais: m.finais, inicio: m.inicio,
          tema: Object.assign({}, TEMA_PADRAO), config: { mostrar_progresso: true, mostrar_numero: true, permitir_voltar: true }
        }).select("id").single();

async function duplicar(id) {
  const { data: f } = await sb.from("fm_forms").select("*").eq("id", id).single();
  if (!f) return;
  const slug = await slugLivre(f.slug + "-copia");
  const { error } = await sb.from("fm_forms").insert({ titulo: f.titulo + " (cópia)", slug, perguntas: f.perguntas, finais: f.finais, inicio: f.inicio, tema: f.tema, config: f.config });
  if (error) return toast("Erro ao duplicar: " + error.message, true);
  toast("Formulário duplicado"); renderLista();
}
async function excluir(f) {
  if (!await confirmar('Excluir "' + f.titulo + '" e todas as respostas?', "Excluir", true)) return;
  const { error } = await sb.from("fm_forms").delete().eq("id", f.id);
  if (error) return toast("Erro ao excluir: " + error.message, true);
  toast("Formulário excluído"); renderLista();
}

// ---------------- EDITOR: estrutura ----------------
function P(id) { return ED.form.perguntas.find((p) => p.id === id); }
function Fim(id) { return ED.form.finais.find((f) => f.id === id); }

function marcarSujo(semPrevia) {
  ED.dirty = true;
  const s = $("#salvo"); if (s) { s.textContent = "Editando…"; s.className = "salvo"; }
  clearTimeout(ED.timer); ED.timer = setTimeout(salvarAgora, 900);
  if (!semPrevia) atualizarPrevia();
}
async function salvarAgora() {
  if (!ED || !ED.dirty) return ED && ED.salvando;
  clearTimeout(ED.timer);
  const ed = ED, f = ed.form;
  ed.dirty = false;
  const s = $("#salvo"); if (s) { s.textContent = "Salvando…"; s.className = "salvo"; }
  ed.salvando = sb.from("fm_forms").update({ titulo: f.titulo, perguntas: f.perguntas, finais: f.finais, inicio: f.inicio, tema: f.tema, config: f.config }).eq("id", f.id)
    .then(({ error }) => {
      const s2 = $("#salvo");
      if (error) { ed.dirty = true; if (s2) { s2.textContent = "Erro ao salvar"; s2.className = "salvo erro"; } toast("Não salvou: " + error.message, true); }
      else if (s2 && !ed.dirty) { s2.textContent = "Salvo ✓"; s2.className = "salvo"; }
    });
  return ed.salvando;
}

function renderEditor() {
  const f = ED.form;
  const abas = [["construir", "Construir"], ["fluxo", "Fluxo"], ["design", "Design"], ["compartilhar", "Compartilhar"], ["resultados", "Resultados"]];
  view.innerHTML =
    '<div class="ed-top"><div class="ed-top-in">' +
    '<a class="b ico ghost" href="#/" aria-label="Voltar para a lista" title="Voltar">←</a>' +
    '<input class="ed-tit" id="ed-tit" value="' + h(f.titulo) + '" aria-label="Nome do formulário" maxlength="120">' +
    '<span class="st ' + f.status + '" id="ed-st">' + h(f.status) + "</span>" +
    '<span class="salvo" id="salvo">' + (ED.dirty ? "Editando…" : "Salvo ✓") + "</span>" +
    '<div class="esp"></div>' +
    '<nav class="abas">' + abas.map(([k, r]) => '<a href="#/f/' + f.id + "/" + k + '" class="' + (ED.aba === k ? "on" : "") + '">' + r + "</a>").join("") + "</nav>" +
    '<div class="esp"></div>' +
    '<button id="ed-ver" class="mini" style="height:36px">Visualizar ↗</button>' +
    (f.status === "publicado" ? '<button id="ed-link" class="mini" style="height:36px">Copiar link</button>' : '<button id="ed-pub" class="pri mini" style="height:36px">Publicar</button>') +
    "</div></div><div id=\"ed-corpo\"></div>";
  $("#ed-tit").oninput = (e) => { f.titulo = e.target.value; marcarSujo(true); };
  $("#ed-ver").onclick = abrirPreviaNova;
  if ($("#ed-pub")) $("#ed-pub").onclick = () => mudarStatus("publicado");
  if ($("#ed-link")) $("#ed-link").onclick = () => copiar(linkForm(f));
  ({ construir: renderConstruir, fluxo: renderFluxo, design: renderDesign, compartilhar: renderCompartilhar, resultados: renderResultados })[ED.aba]();
}

async function mudarStatus(st) {
  const f = ED.form;
  if (st === "publicado") {
    const ps = f.perguntas.filter(FM.ehPergunta);
    if (!ps.length) return toast("Adicione pelo menos uma pergunta antes de publicar.", true);
    const sem = f.perguntas.find((p) => !String(p.titulo || "").trim());
    if (sem) { ED.sel = sem.id; if (ED.aba !== "construir") location.hash = "#/f/" + f.id + "/construir"; else renderConstruir(); return toast("Tem pergunta sem texto. Preencha antes de publicar.", true); }
    const semOp = f.perguntas.find((p) => T[p.tipo] && T[p.tipo].opcoes && !(p.opcoes || []).some((o) => o.texto && o.texto.trim()));
    if (semOp) { ED.sel = semOp.id; if (ED.aba !== "construir") location.hash = "#/f/" + f.id + "/construir"; else renderConstruir(); return toast("Tem pergunta de escolha sem opções.", true); }
  }
  await salvarAgora();
  const { error } = await sb.from("fm_forms").update({ status: st }).eq("id", f.id);
  if (error) return toast("Erro: " + error.message, true);
  f.status = st;
  toast(st === "publicado" ? "Publicado! O link já está no ar." : st === "encerrado" ? "Formulário encerrado." : "Voltou para rascunho.");
  renderEditor();
}

// ---------------- prévia ----------------
let previaJanela = null;
function formParaPrevia() {
  const f = ED.form;
  return JSON.parse(JSON.stringify({ id: f.id, slug: f.slug, titulo: f.titulo, perguntas: f.perguntas, inicio: f.inicio, finais: f.finais, tema: f.tema, config: f.config }));
}
function irDaSelecao() {
  if (!ED.sel) return null;
  if (ED.sel === "inicio") return "inicio";
  if (ED.sel.startsWith("fim:")) return ED.sel;
  return ED.sel;
}
function enviarPrevia(alvo, reiniciar) {
  if (!alvo) return;
  try { alvo.postMessage({ fm: "preview", form: formParaPrevia(), ir: irDaSelecao(), reiniciar: !!reiniciar }, location.origin); } catch (e) {}
}
function atualizarPrevia(reiniciar) {
  clearTimeout(ED.prevTimer);
  ED.prevTimer = setTimeout(() => {
    const fr = $("#prev-frame"); if (fr) enviarPrevia(fr.contentWindow, reiniciar);
  }, 250);
}
window.addEventListener("message", (ev) => {
  if (ev.origin !== location.origin || !ev.data || ev.data.fm !== "pronto" || !ED) return;
  enviarPrevia(ev.source, true);
});
function abrirPreviaNova() {
  previaJanela = window.open("/f.html?preview=1", "fm_previa");
  if (!previaJanela) toast("O navegador bloqueou a janela. Libere pop-ups para este site.", true);
}
function htmlPrevia(titulo) {
  return '<div class="prev"><div class="prev-bar"><span>' + (titulo || "Pré-visualização") + "</span>" +
    '<div class="seg"><button data-tela="pc" class="' + (ED.cel ? "" : "on") + '">Desktop</button><button data-tela="cel" class="' + (ED.cel ? "on" : "") + '">Celular</button></div>' +
    '<button class="ico ghost" id="prev-rein" title="Reiniciar do começo" aria-label="Reiniciar prévia">↺</button></div>' +
    '<div class="prev-moldura' + (ED.cel ? " cel" : "") + '" id="prev-mold"><iframe id="prev-frame" src="/f.html?preview=1" title="Pré-visualização do formulário"></iframe></div></div>';
}
function ligarPrevia() {
  $$("[data-tela]").forEach((b) => b.onclick = () => {
    ED.cel = b.dataset.tela === "cel";
    $$("[data-tela]").forEach((x) => x.classList.toggle("on", x === b));
    $("#prev-mold").classList.toggle("cel", ED.cel);
  });
  const r = $("#prev-rein");
  if (r) r.onclick = () => { const fr = $("#prev-frame"); if (fr) fr.contentWindow.postMessage({ fm: "preview", form: formParaPrevia(), ir: null, reiniciar: true }, location.origin); };
}

// ---------------- CONSTRUIR ----------------
function renderConstruir() {
  $("#ed-corpo").innerHTML = '<div class="construir"><aside class="lado" id="lado"></aside><section class="painel" id="painel"></section>' + htmlPrevia() + "</div>";
  renderLado(); renderPainel(); ligarPrevia();
}

function temLogica(p) { return (p.regras || []).length > 0 || !!p.depois; }

function renderLado() {
  if (!$("#lado")) { if ($("#fluxo")) desenharFluxo(); return; }
  const f = ED.form;
  let n = 0;
  const lado = $("#lado");
  lado.innerHTML =
    '<h4>Início</h4>' +
    '<div class="item' + (ED.sel === "inicio" ? " on" : "") + '" data-sel="inicio"><span class="ic t-tela">▶</span><span class="tx"><b>Tela de boas-vindas</b><small>' + (f.inicio.ativo !== false && (f.inicio.titulo || f.inicio.texto) ? "Ativa" : "Desligada") + "</small></span></div>" +
    '<h4>Perguntas <span>' + f.perguntas.length + "</span></h4>" +
    '<div id="lista-q">' + f.perguntas.map((p) => {
      const t = T[p.tipo] || T.curto;
      if (FM.ehPergunta(p)) n++;
      return '<div class="item' + (ED.sel === p.id ? " on" : "") + '" data-sel="' + p.id + '" draggable="true">' +
        '<span class="n">' + (FM.ehPergunta(p) ? n : "") + "</span>" +
        '<span class="ic ' + GRUPO_CLS[t.grupo] + '">' + t.ic + "</span>" +
        '<span class="tx"><b data-tit="' + p.id + '">' + h(p.titulo || "Sem título") + "</b><small>" + (FM.ehInterno(p) ? t.nome + " · " + resumoBloco(p) : t.nome) + (p.obrigatorio ? " · obrigatória" : "") + (temLogica(p) ? ' · <span class="logica" title="Tem lógica condicional">⤳ lógica</span>' : "") + "</small></span></div>";
    }).join("") + "</div>" +
    '<button class="add" id="add-q">+ Adicionar pergunta</button>' +
    '<h4>Telas finais</h4>' +
    f.finais.map((fi, i) => '<div class="item' + (ED.sel === "fim:" + fi.id ? " on" : "") + '" data-sel="fim:' + fi.id + '"><span class="ic t-fim">✓</span><span class="tx"><b>' + h(fi.nome || fi.titulo || "Final") + "</b><small>" + (i === 0 ? "Padrão" : "Por lógica") + (fi.redirecionar ? " · redireciona" : "") + "</small></span></div>").join("") +
    '<button class="add" id="add-fim">+ Tela final</button>';

  $$(".item[data-sel]", lado).forEach((it) => it.onclick = () => {
    ED.sel = it.dataset.sel; renderLado(); renderPainel(); atualizarPrevia();
    if (innerWidth < 760) { const pn = $("#painel"); if (pn) pn.scrollIntoView({ behavior: "smooth", block: "start" }); }
  });
  $("#add-q").onclick = () => escolherTipo((tipo) => adicionarPergunta(tipo));
  $("#add-fim").onclick = () => {
    const fi = novoFinal("Obrigado!"); fi.nome = "Final " + (f.finais.length + 1);
    f.finais.push(fi); ED.sel = "fim:" + fi.id; marcarSujo(); renderLado(); renderPainel();
  };
  // arrastar para reordenar
  let origem = null;
  $$("#lista-q .item", lado).forEach((it) => {
    it.addEventListener("dragstart", (e) => { origem = it.dataset.sel; it.classList.add("arrastando"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", origem); });
    it.addEventListener("dragend", () => { it.classList.remove("arrastando"); $$(".alvo-cima,.alvo-baixo", lado).forEach((x) => x.classList.remove("alvo-cima", "alvo-baixo")); });
    it.addEventListener("dragover", (e) => {
      e.preventDefault(); const r = it.getBoundingClientRect(); const cima = e.clientY < r.top + r.height / 2;
      it.classList.toggle("alvo-cima", cima); it.classList.toggle("alvo-baixo", !cima);
    });
    it.addEventListener("dragleave", () => it.classList.remove("alvo-cima", "alvo-baixo"));
    it.addEventListener("drop", (e) => {
      e.preventDefault();
      const alvo = it.dataset.sel; if (!origem || origem === alvo) return;
      const r = it.getBoundingClientRect(); const cima = e.clientY < r.top + r.height / 2;
      const ps = f.perguntas; const i = ps.findIndex((p) => p.id === origem); const [m] = ps.splice(i, 1);
      let j = ps.findIndex((p) => p.id === alvo); if (!cima) j++;
      ps.splice(j, 0, m); marcarSujo(); renderLado(); renderPainel();
    });
  });
}

function escolherTipo(cb, atual) {
  const grupos = {};
  Object.entries(T).forEach(([k, t]) => (grupos[t.grupo] = grupos[t.grupo] || []).push([k, t]));
  modal("<h3>" + (atual ? "Mudar tipo da pergunta" : "Adicionar pergunta") + '</h3><div class="tipos">' +
    Object.entries(grupos).map(([g, arr]) => "<h5>" + g + "</h5>" + arr.map(([k, t]) => '<button data-tipo="' + k + '"' + (k === atual ? ' style="background:var(--sel)"' : "") + '><span class="ic ' + GRUPO_CLS[g] + '" style="background:var(--' + (GRUPO_COR[g]) + '-bg)">' + t.ic + "</span>" + t.nome + "</button>").join("")).join("") +
    '</div><div class="rod"><button data-fechar>Cancelar</button></div>',
    (el, fechar) => $$("[data-tipo]", el).forEach((b) => b.onclick = () => { fechar(); cb(b.dataset.tipo); }));
}

function adicionarPergunta(tipo) {
  const f = ED.form;
  const p = { id: FM.uid("q"), tipo, titulo: "", descricao: "", obrigatorio: false, chave: "", regras: [], depois: "" };
  prepararTipo(p);
  let idx = f.perguntas.findIndex((x) => x.id === ED.sel);
  idx = idx >= 0 ? idx + 1 : f.perguntas.length;
  f.perguntas.splice(idx, 0, p);
  ED.sel = p.id; marcarSujo(); renderLado(); renderPainel();
  setTimeout(() => { const t = $("#q-titulo"); if (t) t.focus(); }, 40);
}
function prepararTipo(p) {
  if (T[p.tipo].opcoes && !(p.opcoes || []).length) p.opcoes = [{ id: FM.uid("o"), texto: "" }, { id: FM.uid("o"), texto: "" }];
  if (p.tipo === "escala") { if (p.escala_min == null || p.escala_min === "") p.escala_min = 1; if (!p.escala_max || p.escala_max > 10) p.escala_max = 5; }
  if (p.tipo === "estrelas" && (!p.escala_max || p.escala_max > 10)) p.escala_max = 5;
  if (p.tipo === "aviso") p.obrigatorio = false;
  if (p.tipo === "score") {
    p.obrigatorio = false; p.chave = "";
    if (!p.titulo) p.titulo = "Calcular Lead Score";
    if (!p.score_var) p.score_var = "score";
    if (p.zerar == null) p.zerar = true;
    p.pontuacao = p.pontuacao || [];
  }
  if (p.tipo === "faixa") {
    p.obrigatorio = false; p.chave = "";
    if (!p.titulo) p.titulo = "Separar por score";
    if (!p.score_var) p.score_var = (ED && ED.form ? FM.varsDoForm(ED.form)[0] : "") || "score";
    if (!p.faixas) p.faixas = [
      { id: FM.uid("x"), rotulo: "Quente", min: 70, max: "", destino: "" },
      { id: FM.uid("x"), rotulo: "Morno", min: 40, max: 69.99, destino: "" },
      { id: FM.uid("x"), rotulo: "Frio", min: "", max: 39.99, destino: "" }
    ];
  }
  if (p.tipo === "active") {
    p.obrigatorio = false; p.chave = "";
    if (!p.titulo) p.titulo = "Enviar para o ActiveCampaign";
    if (!p.ac) {
      const ps = (ED && ED.form ? ED.form.perguntas : []).filter(FM.ehPergunta);
      const campos = [];
      const nome = ps.find((q) => FM.paramsDaPergunta(q).includes("nome"));
      if (nome) campos.push({ ac: "_nome_completo", fonte: "q:" + nome.id });
      const tel = ps.find((q) => q.tipo === "telefone");
      if (tel) campos.push({ ac: "phone", fonte: "q:" + tel.id });
      p.ac = { email: "", campos, tags: [], lista: null };
    }
  }
}

function removerReferencias(id, ehFinal) {
  const f = ED.form;
  const alvo = ehFinal ? "fim:" + id : id;
  f.perguntas.forEach((p) => {
    p.regras = (p.regras || []).filter((r) => r.destino !== alvo && !(r.conds || []).some((c) => c.pergunta === id));
    if (p.depois === alvo) p.depois = "";
    (p.faixas || []).forEach((x) => { if (x.destino === alvo) x.destino = ""; });
    if (p.pontuacao) p.pontuacao = p.pontuacao.filter((r) => r.pergunta !== id && !(r.conds || []).some((c) => c.pergunta === id));
  });
}

// ---------- painel de edição ----------
function renderPainel() {
  const pn = $("#painel");
  const f = ED.form;
  if (!ED.sel) { pn.innerHTML = '<div class="painel-in vazio"><h3>Selecione um item</h3><p>Escolha uma pergunta à esquerda ou adicione uma nova.</p></div>'; return; }
  if (ED.sel === "inicio") return painelInicio(pn);
  if (ED.sel.startsWith("fim:")) { const fi = Fim(ED.sel.slice(4)); if (!fi) { ED.sel = null; return renderPainel(); } return painelFim(pn, fi); }
  const p = P(ED.sel); if (!p) { ED.sel = null; return renderPainel(); }
  painelPergunta(pn, p);
}

function campo(rot, html, ajuda) { return '<label class="f"><span>' + rot + "</span>" + html + (ajuda ? "<small>" + ajuda + "</small>" : "") + "</label>"; }
function inp(k, v, attrs) { return '<input data-k="' + k + '" value="' + h(v == null ? "" : v) + '" ' + (attrs || "") + ">"; }
function txa(k, v, attrs) { return '<textarea data-k="' + k + '" ' + (attrs || "") + ">" + h(v || "") + "</textarea>"; }
function tog(k, v, rot) { return '<label class="tg"><input type="checkbox" data-k="' + k + '" data-bool="1"' + (v ? " checked" : "") + "> " + rot + "</label>"; }

// liga inputs com data-k ao objeto
function ligarCampos(el, obj, aoMudar) {
  $$("[data-k]", el).forEach((i) => {
    const ev = i.type === "checkbox" || i.tagName === "SELECT" ? "change" : "input";
    i.addEventListener(ev, () => {
      let v = i.dataset.bool ? i.checked : i.value;
      if (i.dataset.num) v = i.value === "" ? "" : Number(i.value);
      obj[i.dataset.k] = v;
      marcarSujo();
      if (aoMudar) aoMudar(i.dataset.k, v, i);
    });
  });
}

    '<div class="g2">' + campo("Rótulo do menor", inp("rot_min", p.rot_min, 'placeholder="Ex.: Discordo"')) + campo("Rótulo do maior", inp("rot_max", p.rot_max, 'placeholder="Ex.: Concordo"')) + "</div></div>";

  if (p.tipo === "estrelas") extra += '<div class="card"><h3>Estrelas</h3>' + campo("Quantidade", '<select data-k="escala_max" data-num="1">' + [3, 4, 5, 6, 7, 10].map((n) => '<option' + ((+p.escala_max || 5) === n ? " selected" : "") + ">" + n + "</option>").join("") + "</select>") + "</div>";
  if (["curto", "longo", "email", "telefone", "numero"].includes(p.tipo)) {
    extra += '<details class="mais-op"><summary>Mais opções do campo</summary><div class="card">' + campo("Texto de exemplo no campo (placeholder)", inp("placeholder", p.placeholder, 'placeholder="Ex.: Digite sua resposta aqui…"')) +

    if (k === "param") { const lim = String(v).replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 40); if (lim !== v) { el.value = lim; p.param = lim; } }

    if (k === "obrigatorio" || k === "permitir_outro") renderLadoLeve();

    if (p.tipo !== "aviso" && !p.chave && p.titulo.trim()) { p.chave = FM.chaveSugerida(p.titulo, usadas); const c = $("#q-chave"); if (c) c.value = p.chave; marcarSujo(true); }

    (c.opcoes || []).forEach((o) => o.id = FM.uid("o"));
    c.regras = (c.regras || []).map((r) => Object.assign(r, { id: FM.uid("r"), conds: (r.conds || []).map((cd) => cd.pergunta === p.id ? Object.assign(cd, { pergunta: c.id }) : cd) }));

  };

  if (t.opcoes) ligarOpcoes(pn, p);
  renderLogica(p);
}

function mover(p, d) {
  const ps = ED.form.perguntas; const i = ps.indexOf(p); const j = i + d;
  if (j < 0 || j >= ps.length) return;
  ps.splice(i, 1); ps.splice(j, 0, p); marcarSujo(); renderLado(); renderPainel();
}

function ligarOpcoes(pn, p) {
  const redesenhar = (foco) => { renderPainel(); if (foco != null) setTimeout(() => { const el = $('[data-op="' + foco + '"]'); if (el) el.focus(); }, 20); };
  $$("[data-op]", pn).forEach((el) => {
    const j = +el.dataset.op;
    el.addEventListener("input", () => { const antigo = p.opcoes[j].texto; p.opcoes[j].texto = el.value; trocarValorEmRegras(p.id, antigo, el.value); marcarSujo(); renderLadoLeve(); });
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); p.opcoes.splice(j + 1, 0, { id: FM.uid("o"), texto: "" }); marcarSujo(); redesenhar(j + 1); }
      if (e.key === "Backspace" && !el.value && p.opcoes.length > 1) { e.preventDefault(); p.opcoes.splice(j, 1); marcarSujo(); redesenhar(Math.max(0, j - 1)); }
    });
    el.addEventListener("blur", () => renderLogica(p));
  });
  $$("[data-op-del]", pn).forEach((b) => b.onclick = () => { if (p.opcoes.length <= 1) return toast("Precisa de pelo menos uma opção.", true); p.opcoes.splice(+b.dataset.opDel, 1); marcarSujo(); redesenhar(); });
  $$("[data-op-up]", pn).forEach((b) => b.onclick = () => { const j = +b.dataset.opUp; const [o] = p.opcoes.splice(j, 1); p.opcoes.splice(j - 1, 0, o); marcarSujo(); redesenhar(); });
  $("#op-add").onclick = () => { p.opcoes.push({ id: FM.uid("o"), texto: "" }); marcarSujo(); redesenhar(p.opcoes.length - 1); };
  $("#op-colar").onclick = () => modal('<h3>Colar opções</h3>' + campo("Uma opção por linha", '<textarea id="cl" rows="8" placeholder="Opção 1\nOpção 2\nOpção 3"></textarea>') +
    tog("_subst", true, "Substituir as opções atuais").replace('data-k="_subst"', 'id="cl-subst"') +
    '<div class="rod"><button data-fechar>Cancelar</button><button class="pri" id="cl-ok">Adicionar</button></div>', (el, fechar) => {
      $("#cl-ok", el).onclick = () => {
        const linhas = $("#cl", el).value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
        if (!linhas.length) return fechar();
        const novas = linhas.map((t) => ({ id: FM.uid("o"), texto: t }));
        if ($("#cl-subst", el).checked) p.opcoes = novas; else p.opcoes = p.opcoes.filter((o) => o.texto.trim()).concat(novas);
        fechar(); marcarSujo(); redesenhar();
      };
    });
}
function trocarValorEmRegras(qid, antigo, novo) {
  if (!antigo) return;
  ED.form.perguntas.forEach((x) => (x.regras || []).concat(x.pontuacao || []).forEach((r) => (r.conds || []).forEach((c) => { if (c.pergunta === qid && c.valor === antigo) c.valor = novo; })));
}

// ---------- lógica condicional ----------
function opsPara(q) {
  if (!q) return [];
  const t = q.tipo;
  let base;
  if (t === "multipla") base = [["igual", "inclui"], ["diferente", "não inclui"]];
  else if (["unica", "lista", "sim_nao"].includes(t)) base = [["igual", "é"], ["diferente", "não é"]];
  else if (["nps", "escala", "estrelas", "numero"].includes(t)) base = [["igual", "é igual a"], ["diferente", "é diferente de"], ["maior", "é maior que"], ["menor", "é menor que"], ["maior_igual", "é maior ou igual a"], ["menor_igual", "é menor ou igual a"]];
  else base = [["igual", "é igual a"], ["diferente", "é diferente de"], ["contem", "contém"], ["nao_contem", "não contém"]];
  return base.concat([["respondeu", "foi respondida"], ["nao_respondeu", "não foi respondida"]]);
}
function valoresPossiveis(q) {
  if (!q) return null;
  if (q.tipo === "sim_nao") return ["Sim", "Não"];
  if (T[q.tipo] && T[q.tipo].opcoes) return (q.opcoes || []).map((o) => o.texto).filter((s) => s && s.trim());
  if (q.tipo === "nps") return Array.from({ length: 11 }, (_, i) => String(i));
  if (q.tipo === "escala") { const a = []; for (let n = +q.escala_min || 0; n <= (+q.escala_max || 5); n++) a.push(String(n)); return a; }
  if (q.tipo === "estrelas") return Array.from({ length: +q.escala_max || 5 }, (_, i) => String(i + 1));
  return null;
}
function qVar(nome) { return { id: "$" + nome, tipo: "numero", titulo: "Lead Score (" + nome + ")", _var: true }; }
function Pq(id) { return id && id[0] === "$" ? qVar(id.slice(1)) : P(id); }
function rotuloQ(q) {
  if (q && q._var) return "Σ " + q.titulo;
  const ps = ED.form.perguntas.filter(FM.ehPergunta);
  const n = ps.indexOf(q) + 1;
  const t = (q.titulo || "Sem título").replace(/\{\{|\}\}/g, "");
  return (n ? n + ". " : "") + (t.length > 46 ? t.slice(0, 46) + "…" : t);
}
function opcoesDestino(atualId, sel, comPadrao) {
  const f = ED.form;
  const i = f.perguntas.findIndex((x) => x.id === atualId);
  let o = comPadrao ? '<option value=""' + (!sel ? " selected" : "") + ">Próxima pergunta da lista</option><option value=\"fim\"" + (sel === "fim" ? " selected" : "") + ">Encerrar (tela final padrão)</option>" : "";
  o += '<optgroup label="Perguntas">' + f.perguntas.map((q, j) => j === i ? "" : '<option value="' + q.id + '"' + (sel === q.id ? " selected" : "") + ">" + h(rotuloQ(q) || "Texto") + (j < i ? " (volta)" : "") + "</option>").join("") + "</optgroup>";
  o += '<optgroup label="Telas finais">' + f.finais.map((fi) => '<option value="fim:' + fi.id + '"' + (sel === "fim:" + fi.id ? " selected" : "") + ">✓ " + h(fi.nome || fi.titulo || "Final") + "</option>").join("") + "</optgroup>";
  return o;
}

function renderLogica(p) {
  const box = $("#logica"); if (!box) return;
  const f = ED.form;
  const i = f.perguntas.indexOf(p);
  const candidatas = f.perguntas.slice(0, i + 1).filter(FM.ehPergunta).concat(FM.varsDoForm(f).map(qVar));

    p.regras.map((r, ri) => {

          const vals = valoresPossiveis(q);

          }

            '<select data-co="' + ci + '">' + ops.map(([k, l]) => '<option value="' + k + '"' + (c.op === k ? " selected" : "") + ">" + l + "</option>").join("") + "</select>" +
            (semValor ? "<span></span>" : campoV) +
            (r.conds.length > 1 ? '<button class="ico ghost mini" data-cdel="' + ci + '" aria-label="Remover condição">×</button>' : "<span></span>") + "</div>";

        '<div class="destino"><b>→ ir para</b><select data-rdest>' + opcoesDestino(p.id, r.destino, false) + "</select></div></div>";
    }).join("") +
    '<button class="mini" id="r-add" style="margin-bottom:14px">+ Adicionar regra</button>' +
    campo(p.regras.length ? "Caso nenhuma regra bata, ir para" : "Depois desta pergunta, ir para", '<select id="q-depois">' + opcoesDestino(p.id, p.depois, true) + "</select>",
      "“Próxima pergunta” segue a ordem da lista. Se for a última, vai para a tela final padrão.");

  const mud = () => { marcarSujo(); renderLadoLeve(); };
  $("#q-depois", box).onchange = (e) => { p.depois = e.target.value; mud(); };
  $("#r-add", box).onclick = () => {
    const vals = valoresPossiveis(p);

    const qRef = !FM.ehPergunta(p) ? candidatas[candidatas.length - 1] : p;
    if (!qRef) return toast("Adicione uma pergunta antes para criar regras.", true);
    const valsRef = valoresPossiveis(qRef);
    p.regras.push({ id: FM.uid("r"), juncao: "e", conds: [{ pergunta: qRef.id, op: ops[0][0], valor: valsRef ? valsRef[0] : "" }], destino: f.finais[0] ? "fim:" + f.finais[0].id : "" });
    const prox = f.perguntas[i + 1]; if (prox) p.regras[p.regras.length - 1].destino = prox.id;
    void vals; mud(); renderLogica(p);
  };
  $$(".regra", box).forEach((el) => {
    const r = p.regras[+el.dataset.ri];
    $("[data-rdel]", el).onclick = () => { p.regras.splice(+el.dataset.ri, 1); mud(); renderLogica(p); };
    $("[data-rdest]", el).onchange = (e) => { r.destino = e.target.value; mud(); };
    $("[data-cadd]", el).onclick = () => { const q = Pq(r.conds[r.conds.length - 1].pergunta) || p; const v = valoresPossiveis(q); r.conds.push({ pergunta: q.id, op: opsPara(q)[0][0], valor: v ? v[0] : "" }); mud(); renderLogica(p); };
    $$("[data-jn]", el).forEach((b) => b.onclick = () => { r.juncao = b.dataset.jn; mud(); renderLogica(p); });
    $$("[data-cq]", el).forEach((s) => s.onchange = () => { const c = r.conds[+s.dataset.cq]; c.pergunta = s.value; const q = Pq(s.value); c.op = opsPara(q)[0][0]; const v = valoresPossiveis(q); c.valor = v ? v[0] : ""; mud(); renderLogica(p); });
    $$("[data-co]", el).forEach((s) => s.onchange = () => { r.conds[+s.dataset.co].op = s.value; mud(); renderLogica(p); });
    $$("[data-cv]", el).forEach((s) => s.addEventListener(s.tagName === "SELECT" ? "change" : "input", () => { r.conds[+s.dataset.cv].valor = s.value; mud(); }));
    $$("[data-cdel]", el).forEach((b) => b.onclick = () => { r.conds.splice(+b.dataset.cdel, 1); mud(); renderLogica(p); });
  });
}

// ---------------- FLUXO VISUAL ----------------
const FX_W = 250;
const OP_SIMB = { igual: "=", diferente: "≠", maior: ">", menor: "<", maior_igual: "≥", menor_igual: "≤", contem: "contém", nao_contem: "não contém", respondeu: "respondeu", nao_respondeu: "não respondeu" };
function fxExiste(id) { return id && (id.startsWith("fim:") ? !!Fim(id.slice(4)) : !!P(id)); }
function fxNos() {
  const f = ED.form, nos = [];
  if (f.inicio.ativo !== false && (f.inicio.titulo || f.inicio.texto)) nos.push({ id: "inicio", tipo: "inicio" });
  f.perguntas.forEach((p) => nos.push({ id: p.id, tipo: "pergunta", p }));
  f.finais.forEach((fi, i) => nos.push({ id: "fim:" + fi.id, tipo: "fim", fi, padrao: i === 0 }));
  return nos;
}
function npsFaixa(r, pid) {
  const c = r.conds || [];
  if (!c.every((x) => x.pergunta === pid)) return null;
  const v = (x) => Number(x.valor);
  if (c.length === 1 && c[0].op === "menor_igual" && v(c[0]) === 6) return "det";
  if (c.length === 1 && c[0].op === "maior_igual" && v(c[0]) === 9) return "pro";
  if (c.length === 2 && r.juncao !== "ou") {
    const a = c.find((x) => x.op === "maior_igual"), b = c.find((x) => x.op === "menor_igual");
    if (a && b && v(a) === 7 && v(b) === 8) return "neu";
  }
  return null;
}
function resumoRegra(r, p) {
  const cs = (r.conds || []).map((c) => {
    const q = P(c.pergunta);
    const quem = !q || q === p ? "" : (q.chave || rotuloQ(q)) + " ";
    return quem + (OP_SIMB[c.op] || c.op) + (["respondeu", "nao_respondeu"].includes(c.op) ? "" : " " + c.valor);
  });
  return "Se " + cs.join(r.juncao === "ou" ? " ou " : " e ");
}
function fxPortas(p) {
  const f = ED.form, portas = [], usadas = new Set(), regras = p.regras || [], t = p.tipo;
  const simples = (r) => { const c = r.conds || []; return c.length === 1 && c[0].pergunta === p.id && c[0].op === "igual" ? String(c[0].valor) : null; };
  if (["unica", "lista", "sim_nao", "multipla"].includes(t)) {
    const ops = t === "sim_nao" ? ["Sim", "Não"] : (p.opcoes || []).map((o) => o.texto).filter((s) => s && s.trim());
    ops.forEach((v) => {
      const r = regras.find((x) => !usadas.has(x.id) && simples(x) === v); if (r) usadas.add(r.id);
      portas.push({ chave: "op:" + v, rot: v, alvo: r && fxExiste(r.destino) ? r.destino : null, rid: r ? r.id : null, spec: { tipo: "op", valor: v }, cls: "op" });
    });
  }
  if (t === "nps") {
    [["det", "Detratores (0–6)"], ["neu", "Neutros (7–8)"], ["pro", "Promotores (9–10)"]].forEach(([k, rot]) => {
      const r = regras.find((x) => !usadas.has(x.id) && npsFaixa(x, p.id) === k); if (r) usadas.add(r.id);
      portas.push({ chave: "nps:" + k, rot, alvo: r && fxExiste(r.destino) ? r.destino : null, rid: r ? r.id : null, spec: { tipo: "nps", faixa: k }, cls: "nps-" + k });
    });
  }
  if (t === "faixa") (p.faixas || []).forEach((x) => portas.push({ chave: "fx:" + x.id, rot: (x.rotulo || "Faixa") + " (" + FM.rotuloFaixa(x) + ")", alvo: fxExiste(x.destino) ? x.destino : null, spec: { tipo: "faixa", id: x.id }, cls: "faixa" }));
  regras.forEach((r) => { if (!usadas.has(r.id)) portas.push({ chave: "r:" + r.id, rot: resumoRegra(r, p), alvo: fxExiste(r.destino) ? r.destino : null, rid: r.id, spec: { tipo: "regra" }, cls: "regra" }); });
  const i = f.perguntas.indexOf(p);
  let alvo = p.depois, impl = false;
  if (p.depois === "fim") alvo = null;
  else if (!fxExiste(alvo)) { impl = true; alvo = f.perguntas[i + 1] ? f.perguntas[i + 1].id : (f.finais[0] ? "fim:" + f.finais[0].id : null); }
  portas.push({ chave: "padrao", rot: p.tipo === "faixa" ? "Nenhuma faixa" : portas.length ? "Qualquer outra resposta" : (p.tipo === "aviso" ? "Continuar" : p.tipo === "active" ? "Depois de enviar" : p.tipo === "score" ? "Depois de calcular" : "Depois de responder"), alvo, impl, spec: { tipo: "padrao" }, cls: "padrao" });
  return portas;
}
function fxLigar(p, chave, alvo) {
  const porta = fxPortas(p).find((x) => x.chave === chave); if (!porta) return;
  p.regras = p.regras || [];
  if (porta.spec.tipo === "padrao") p.depois = alvo;
  else if (porta.spec.tipo === "faixa") { const x = (p.faixas || []).find((y) => y.id === porta.spec.id); if (x) x.destino = alvo; }
  else if (porta.rid) { const r = p.regras.find((x) => x.id === porta.rid); if (r) r.destino = alvo; }
  else {
    let conds, juncao = "e";
    if (porta.spec.tipo === "op") conds = [{ pergunta: p.id, op: "igual", valor: porta.spec.valor }];
    else if (porta.spec.faixa === "det") conds = [{ pergunta: p.id, op: "menor_igual", valor: "6" }];
    else if (porta.spec.faixa === "pro") conds = [{ pergunta: p.id, op: "maior_igual", valor: "9" }];
    else conds = [{ pergunta: p.id, op: "maior_igual", valor: "7" }, { pergunta: p.id, op: "menor_igual", valor: "8" }];
    p.regras.push({ id: FM.uid("r"), conds, juncao, destino: alvo });
  }
  marcarSujo();
}
function fxDesligar(p, chave) {
  const porta = fxPortas(p).find((x) => x.chave === chave); if (!porta) return;
  if (porta.spec.tipo === "padrao") p.depois = "fim";
  else if (porta.spec.tipo === "faixa") { const x = (p.faixas || []).find((y) => y.id === porta.spec.id); if (x) x.destino = ""; }
  else if (porta.rid) p.regras = (p.regras || []).filter((x) => x.id !== porta.rid);
  marcarSujo();
}

function fxPosicoes() {
  const f = ED.form;
  f.config.fluxo_pos = f.config.fluxo_pos || {};
  return f.config.fluxo_pos;
}
function fxAutoLayout(soFaltantes) {
  const f = ED.form, pos = fxPosicoes(), nos = fxNos();
  const ordem = {}; nos.forEach((n, i) => ordem[n.id] = i);
  const prof = {};
  const temInicio = nos[0] && nos[0].id === "inicio";
  if (temInicio) prof.inicio = 0;
  const base = temInicio ? 1 : 0;
  f.perguntas.forEach((p, i) => { if (prof[p.id] == null) prof[p.id] = i === 0 ? base : null; });
  // caminho mais longo considerando só ligações "para frente" na lista
  for (let it = 0; it < f.perguntas.length + 2; it++) {
    f.perguntas.forEach((p) => {
      if (prof[p.id] == null) return;
      fxPortas(p).forEach((pt) => {
        if (!pt.alvo || pt.alvo.startsWith("fim:") || ordem[pt.alvo] <= ordem[p.id]) return;
        prof[pt.alvo] = Math.max(prof[pt.alvo] || 0, prof[p.id] + 1);
      });
    });
  }
  let ult = base;
  f.perguntas.forEach((p) => { if (prof[p.id] == null) prof[p.id] = ult + 1; ult = prof[p.id]; });
  const maxQ = Math.max(base, ...f.perguntas.map((p) => prof[p.id]));
  f.finais.forEach((fi) => prof["fim:" + fi.id] = maxQ + 1);
  const colY = {};
  nos.forEach((n) => {
    const c = prof[n.id] || 0;
    const alt = n.tipo === "pergunta" ? 78 + fxPortas(n.p).length * 30 : 92;
    const y = colY[c] || 40;
    colY[c] = y + alt + 36;
    if (!soFaltantes || !pos[n.id]) pos[n.id] = [40 + c * (FX_W + 110), y];
  });
}

function renderFluxo() {
  if (!ED.fxView) ED.sel = null; // primeira vez: canvas inteiro visível
  ED.fxView = ED.fxView || null;
  $("#ed-corpo").innerHTML = '<div class="fluxo"><div class="fx-canvas" id="fluxo" tabindex="0" aria-label="Fluxo do formulário">' +

    '<div class="fx-barra"><button class="mini" id="fx-addq">+ Pergunta</button><button class="mini" id="fx-addf">+ Tela final</button><button class="mini ghost" id="fx-org" title="Reorganizar todas as etapas em colunas">Organizar</button></div>' +
    '<div class="fx-zoom"><button class="ico ghost" id="fx-zm" aria-label="Diminuir zoom">−</button><span id="fx-zv">100%</span><button class="ico ghost" id="fx-zp" aria-label="Aumentar zoom">+</button><button class="mini ghost" id="fx-fit">Ajustar</button></div>' +

function fxPainel() {
